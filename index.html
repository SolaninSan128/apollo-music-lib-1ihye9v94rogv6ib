赏（《つぐない》）"], ["1985", "日本有线大赏·大赏（《愛人》）；首次登上 NHK 红白歌会"], ["1986", "日本有线大赏三连冠（《時の流れに身をまかせ》）、日本唱片大赏金赏；《时代》杂志评为世界七大女歌手之一"], ["1995", "香港金针奖（追授）"], ["2007", "入选东京古贺政男音乐博物馆「大众音乐殿堂」，唯一的非日本人"], ["2010", "《月亮代表我的心》获华语金曲奖「30 年经典」第一"]], "influences": {"from": [{"name": "京剧", "desc": "爸爸是京剧迷，她从小跟着听"}, {"name": "黄梅调", "desc": "妈妈常带她去看黄梅调电影，她第一个大奖就是唱《访英台》拿的"}, {"name": "时代曲", "desc": "老上海流行歌；她翻唱的《何日君再来》在大陆流传极广"}, {"name": "日本歌谣曲", "desc": "维基把日本音乐列为她的主要影响之一"}], "to": [{"name": "王菲 Faye Wong", "desc": "受她影响的歌手之一；1995 年翻唱《但愿人长久》，1996 年在颁奖礼上唱《我只在乎你》纪念她"}, {"name": "周杰伦 Jay Chou", "desc": "维基列出的受她影响的歌手之一"}, {"name": "桑田佳祐 Keisuke Kuwata", "desc": "她用中文翻唱过桑田的《Merry X'mas in Summer》；桑田也在《ひとり紅白歌合戦》里唱过她的《つぐない》", "tag": "你的歌单里有"}, {"name": "崔健", "desc": "「中国摇滚之父」也把她列为影响"}, {"name": "JUJU", "desc": "翻唱过《つぐない》，2023 年在 NHK 红白唱了《時の流れに身をまかせ》"}]}, "live": [{"title": "甜蜜蜜（1981 · 台视《君在前哨》）", "yt": "FXXok7n0CmQ", "url": "https://www.youtube.com/watch?v=FXXok7n0CmQ", "thumb": "daily_artist/yt_FXXok7n0CmQ.jpg", "src": "台视官方频道", "desc": "1981 年 8 月她花了一个月巡回各地军营唱歌，台视把这些演出做成特别节目《君在前哨》。"}, {"title": "北国の春 / 我和你（1985 · 现场）", "yt": "aB3OhbxS3EM", "url": "https://www.youtube.com/watch?v=aB3OhbxS3EM", "thumb": "daily_artist/yt_aB3OhbxS3EM.jpg", "src": "Teresa Teng 官方 VEVO", "desc": "官方频道发布的 1985 年现场，唱的是《北国の春》和《我和你》。同一年她在东京 NHK Hall 开了生前最后一场个人演唱会，收入全部捐作慈善。"}, {"title": "時の流れに身をまかせ（1986 · 日本电视节目）", "yt": "QTimne1aStE", "url": "https://www.youtube.com/watch?v=QTimne1aStE", "thumb": "daily_artist/yt_QTimne1aStE.jpg", "src": "乐迷上传（非官方）", "desc": "标题写的是 1986 年 5 月 19 日播出的电视演唱，正是这首歌在日本当红的那一年。"}], "live_note": {"text": "更多官方影像在她的 VEVO 频道", "link": ["TeresaTengVEVO", "https://www.youtube.com/@TeresaTengVEVO"]}, "trivia": ["她的本名是邓丽筠。「筠」老被人念成 jūn，她就顺势把艺名定成了「丽君」。", "十四岁时她在台北高级夜总会「巴黎之夜」连续登台 70 天，每天唱 90 分钟，创下纪录。", "《月亮代表我的心》差点被扔掉：作曲翁清溪自己觉得不好，是作词孙仪在一堆待废的曲子里把它翻了出来。", "庄奴给《甜蜜蜜》填词只花了五分钟——他一听是给邓丽君唱的，照着对她「甜」的印象就写完了。", "她会用国语、闽南语、粤语、上海话、日语、印尼语、英语、意大利语唱歌，一生录了 1700 多首。", "1985 年第一次上 NHK 红白歌会唱《愛人》，她穿的是自己设计的杨贵妃造型。"]}, {"date": "2026-10-21", "name": "Bruno Mars", "name_native": "Bruno Mars", "name_zh": "火星哥 布鲁诺·马尔斯", "name_en": "Bruno Mars", "badge": "现象级", "kind": "hot", "region": "欧美", "meta": "美国 · 唱作人 / 制作人 · 流行 / 放克 / R&B · 1985 年生于夏威夷檀香山", "why": "今天日推第一首就是《上を向いて歩こう》——2022 年他在东京巨蛋坐到钢琴前，用日语唱过这首。他的歌你多半听过，但这个人值得认识一下：2016 年超级碗中场，他还是你歌单里 Coldplay 请来的嘉宾。", "photo": "daily_artist/20261021_brunomars_apple.jpg", "photo_credit": "照片：Apple Music", "stats": [["1.5 亿+", "唱片总销量"], ["16 座", "格莱美奖"], ["10 首", "Billboard 冠军单曲"]], "in_library": [], "story": {"paragraphs": ["1985 年，他出生在夏威夷檀香山，本名 Peter Gene Hernandez。爸爸是打击乐手，妈妈是草裙舞者兼歌手，两人就是在同一场演出里认识的。两岁时，爸爸觉得他长得像摔角手 Bruno Sammartino，就管他叫 **Bruno**。四岁起他每周五天跟着家里的乐队上台，模仿猫王在当地出了名，小报叫他“小猫王”。可 12 岁那年父母离婚、家里生意垮了，他跟着爸爸和哥哥住过车里、楼顶，还住过一座关了门的鸟园。", "2003 年高中一毕业，他就去了洛杉矶。Motown 签下他，没多久又把他放了。他索性转去幕后写歌：搭档 Philip Lawrence 第一次去见他时连公交车钱都掏不出。2008 年，两人把一首《Lost》以 2 万美元卖给重组的男团 Menudo，靠这笔钱撑了下来，后来组成制作团队 **The Smeezingtons**，给 Flo Rida、CeeLo Green 等人写歌。至于艺名里的 Mars，他说是因为“很多女孩说我不像地球人”。", "让大众认识他的，是 2009–2010 年给 B.o.B《Nothin' on You》和 Travie McCoy《Billionaire》唱的副歌。2010 年第一首个人单曲《Just the Way You Are》就登顶多国；2014 年他主唱超级碗中场秀，1.153 亿人收看，比看比赛的人还多，是当时的纪录；同年底他和 Mark Ronson 发行的《Uptown Funk》在 Billboard 榜首待了 14 周，后来成了 Billboard 评出的 2010 年代最佳单曲。", "2016 年的《24K Magic》，是他想把小时候跟着跳舞的 90 年代 R&B 找回来，结果 2018 年格莱美他提名的奖项全拿了，包括年度专辑。2021 年他和 Anderson .Paak 组成 **Silk Sonic**，做了一整张七十年代味道的灵魂乐；2024 年和 Lady Gaga 的《Die with a Smile》、和 ROSÉ 的《APT.》又接连登顶。到现在他卖出了 1.5 亿多张唱片，拿了 16 座格莱美，2026 年还出了十年来第一张个人专辑《The Romantic》，一发就是 Billboard 专辑榜第一。"], "sources": [["Wikipedia: Bruno Mars", "https://en.wikipedia.org/wiki/Bruno_Mars"], ["维基百科（日）ブルーノ・マーズ", "https://ja.wikipedia.org/wiki/%E3%83%96%E3%83%AB%E3%83%BC%E3%83%8E%E3%83%BB%E3%83%9E%E3%83%BC%E3%82%BA"], ["Wikipedia: Locked Out of Heaven", "https://en.wikipedia.org/wiki/Locked_Out_of_Heaven"], ["Wikipedia: Just the Way You Are", "https://en.wikipedia.org/wiki/Just_the_Way_You_Are_(Bruno_Mars_song)"], ["Wikipedia: That's What I Like", "https://en.wikipedia.org/wiki/That%27s_Wha k Sonic《Leave the Door Open》拿下格莱美年度制作、年度歌曲等 4 项"], ["2025", "格莱美·最佳流行组合/合作表演（与 Lady Gaga 的《Die with a Smile》）"], ["2026", "《The Romantic》登顶 Billboard 200；《I Just Might》空降 Hot 100 冠军，是他第 10 首冠军单曲"]], "influences": {"from": [{"name": "Elvis Presley", "desc": "从小模仿猫王登台，这段经历对他的音乐和台风影响很大"}, {"name": "Michael Jackson", "desc": "小时候也模仿他；《Treasure》常被拿来和他比"}, {"name": "The Police", "desc": "《Locked Out of Heaven》就是受他们启发写的"}, {"name": "Little Richard", "desc": "爸爸在台上唱他的歌，是他最早的启蒙"}, {"name": "James Brown", "desc": "演出前常看他的 T.A.M.I. Show，舞步也学他"}], "to": [{"name": "Meghan Trainor", "desc": "她的出道单曲《All About That Bass》受《Just the Way You Are》启发"}, {"name": "嵐 ARASHI", "desc": "他给嵐写过《Whenever You Call》，2022 年东京巨蛋还自己唱了"}, {"name": "Coldplay", "desc": "2016 年超级碗 50 中场秀，Coldplay 是主角，他和 Beyoncé 是嘉宾", "tag": "你的歌单里有"}, {"name": "Anderson .Paak", "desc": "一起组了 Silk Sonic"}, {"name": "ROSÉ", "desc": "2024 年合唱《APT.》，登顶 Billboard 全球榜"}]}, "live": [{"title": "Leave the Door Open（2021 · 第 63 届格莱美）", "yt": "_d4yW6Lz_1o", "url": "https://www.youtube.com/watch?v=_d4yW6Lz_1o", "thumb": "daily_artist/yt__d4yW6Lz_1o.jpg", "src": "Bruno Mars 官方 YouTube", "desc": "Silk Sonic 在 2021 年格莱美上唱这首新歌，评论说它像一档七十年代的 Soul Train 电视节目。"}, {"title": "That's What I Like（2017 · 全英音乐奖）", "yt": "EK4ousC7SSQ", "url": "https://www.youtube.com/watch?v=EK4ousC7SSQ", "thumb": "daily_artist/yt_EK4ousC7SSQ.jpg", "src": "Bruno Mars 官方 YouTube", "desc": "他在 2017 年 Brit Awards 上唱这首；第二年它就拿下了格莱美年度歌曲。"}, {"title": "上を向いて歩こう / Talking to the Moon（2022 · 京セラ巨蛋）", "yt": "a4fNOzCc8Ag", "url": "https://www.youtube.com/watch?v=a4fNOzCc8Ag", "thumb": "daily_artist/yt_a4fNOzCc8Ag.jpg", "src": "乐迷拍摄（非官方）", "desc": "2022 年日本巡演，他在钢琴前的金曲接龙里用日语唱了一段《上を向いて歩こう》——正好接上今天日推的第一首。"}], "live_note": {"text": "更多官方现场在他的 YouTube 频道", "link": ["@brunomars", "https://www.youtube.com/@brunomars"]}, "trivia": ["名字是两半拼的：Bruno 是爸爸看他两岁时长得像摔角手 Bruno Sammartino 起的；Mars 是他自己加的，理由是“很多女孩说我不像地球人”。", "他四岁起每周五天跟家里的乐队在夏威夷酒店演出，被当地小报称作“小猫王”；1992 年还在尼古拉斯·凯奇主演的电影《Honeymoon in Vegas》里客串过小猫王。", "搭档 Philip Lawrence 第一次去见他时连公交车钱都没有。介绍人说路费他来报，Lawrence 回答：“给我 5 块钱坐公交就行。”", "他的第一笔大收入，是 2008 年把一首叫《Lost》的歌以 2 万美元卖给了重组的男团 Menudo。", "录《24K Magic》时，他在录音室定了着装规定：不许穿运动裤，要戴首饰、穿好衣服，好录出“丝滑、有灵魂”的感觉。", "2022 年东京巨蛋最后一场，他穿着读卖巨人队球衣上台，背号 1，名字那里绣的是“KAWAII”，还用日语喊了句「キュンです！」；2024 年又给日本的堂吉诃德（ドン・キホーテ）拍广告，顺手把「ドンキイクヨ」的广告歌也做了。"]}, {"date": "2026-10-20", "name": "山下達郎 Tatsuro Yamashita", "name_native": "山下達郎", "name_zh": "山下达郎", "name_en": "Tatsuro Yamashita", "badge": "跨时代经典", "kind": "classic", "region": "日本", "meta": "日本 · 唱作人 / 制作人 · City Pop · 1953 年生于东京", "why": "海外乐迷叫他“City Pop 之王”。你曲库里的《DAYDREAM》是他唱的，《Plastic Love》是他编曲、制作的——该认识一下这个人了。", "photo": "daily_artist/20261020_yamashita_apple.jpg", "photo_credit": "照片：Apple Music", "stats": [["≈900 万", "专辑总销量"], ["40 年", "圣诞歌连续上榜"], ["13 张", "原创录音室专辑"]], "in_library": ["DAYDREAM", "Plastic Love · 竹内まりや"], "story": {"paragraphs": ["1953 年，山下达郎出生在东京池袋，爸妈开着一家小居酒屋。小学六年级他被老师拉进鼓号队打鼓，初中又在铜管乐队敲了好几年小军鼓；家里给他买了一把尤克里里，他就自己摸索着学起了吉他。也是那时候，同学带他听了 The Ventures，他一下迷上了欧美流行乐，成了每周追 Top 40 排行榜的铁杆听众。", "他原本的梦想是当天文学家，可高中那几年成绩一路下滑，差点留级，最后几乎是“被赶出”校门才毕的业。进了明治大学法学部，三个月就退学了。1972 年，他和几个玩乐队的朋友自己掏钱做了张唱片。靠着这张唱片，他认识了大贯妙子等伙伴，组成了 **Sugar Babe**；伊藤银次又把唱片拿给大滝詠一听，大滝后来成了乐队的制作人。1975 年，乐队出了唯一一张专辑《SONGS》。", "乐队散了以后他单飞，但头几年并不红，圈里人叫他“和声之神”，更像个离不开的录音室帮手。转折在 1980 年：他亲自出镜给 maxell 磁带拍广告，广告歌《RIDE ON TIME》冲进榜单前三，同名专辑直接拿下第一；两年后的《FOR YOU》又打出“夏天、大海、达郎”的口号，成了他一辈子的标签。1982 年他娶了竹内玛利亚，后来她的歌也都交给他编曲、制作。", "他被叫作“音的匠人”：很多歌从和声、吉他、合成器到打击乐全是他一个人录的，甚至能一个人叠唱出整支阿卡贝拉。他还给自己定了三条规矩：不上电视露脸、不去巨蛋体育馆开唱、不写书。最倔的一条是——他的歌至今几乎不上流媒体，他说“恐怕到死都不会”。可偏偏到了 2010 年代，海外网友在 YouTube 上把他和那批老唱片挖了出来，City Pop 就这样在海外火了起来。"], "sources": [["维基百科（日）山下達郎", "https://ja.wikipedia.org/wiki/%E5%B1%B1%E4%B8%8B%E9%81%94%E9%83%8E"], ["Wikipedia: Tatsuro Yamashita", "https://en.wikipedia.org/wiki/Tatsuro_Yamashita"], ["Wikipedia: Ride on Time (album)", "https://en.wikipedia.org/wiki/Ride_on_Time_(album)"], ["Wikipedia: For You", "https://en.wikipedia.org/wiki/For_You_(Tatsuro_Yamashita_album)"], ["Wikipedia: Melodies", "https:// {"title": "レイニー・デイ (Rainy Day)", "artist": "横山輝一 Kiichi Yokoyama", "album": "VOICE", "year": 1987, "spotify": "", "alt_url": "https://www.youtube.com/watch?v=5yg1Q_eS8Es", "netease": "https://music.163.com/song?id=2055882960", "cover": "", "file_flac": "", "file_mp3": "/115/音乐库/歌单/city-pop-dj-set/横山辉一 - RAINY DAY.mp3"}, "hook": "一个男声把雨天的心事唱得又暖又松：键盘铺底、萨克斯风在缝里接话，节奏不急不慢地晃。它不是那种一听就跳起来的城市流行，而是下雨天坐在窗边、外面霓虹都晕开了的那一种。", "listen": {"rhythm": "中速、带一点放克弹性的律动，不赶拍子。Discogs 把这张专辑归在摇滚、放克/灵魂、流行三类里——这首偏放克和灵魂那一侧。", "lead": "编曲和键盘都是 Tomoyuki Sasaoka（Discogs 上的写法），所以整首歌的底色是键盘；中间穿插的中音萨克斯风，Discogs 写作 Eiji Toki——从他参与过的唱片看，很可能就是山下達郎巡演乐队里吹了 30 多年的土岐英史（待核实）；吉他是 Kunio Kubota。", "vocal": "横山輝一自己作曲，词是 Norie Kanzawa 写的。他的嗓子偏厚、偏暖，后面有三位女声和声，让副歌更圆。", "production": "1987 年 5 月 1 日由 Fun House 发行的第二张专辑《VOICE》A 面第 2 首，长 4 分 06 秒，制作人 Hiroyuki Igarashi（均据 Discogs）。同年也作为单曲发行。你歌单里这一版来自网易云上的精选集《Best Of Best : Early Kiichi》（选自他 Fun House 时期的四张专辑），不是原专辑母带，但应是同一首。", "genre": "City pop（城市流行）：70 年代中期出现、80 年代最红的日本都市流行乐。英文维基说它其实混了放克、迪斯科、R&B、AOR、软摇滚，还借用了美国软摇滚（Steely Dan、Doobie Brothers）里常见的爵士和弦。"}, "story": ["横山輝一 1961 年生在北海道芦別。1981 年他拿下 CBS・Sony 新人选秀「SD オーディション」的最优秀艺人，先在一支叫 Stella 的乐队当主唱，1986 年才从 Fun House 正式出道。", "1987 年是他最忙的一年：连发《CAN'T LOOK BACK》《HUSKY HEART》《RAINY DAY》《LULLABY IN BLUE》四张单曲和专辑《VOICE》。1989 年发完第四张专辑后，他宣布暂停活动，去了美国。", "1991 年他换到 Polystar 重新出发，此后也给别人写歌、做制作，比如 1992 年 ZOO 的热门单曲《YA-YA-YA》就是他作的曲。现在主要围绕歌迷俱乐部做演出和发片。《Rainy Day》这类 Fun House 时期的作品，Spotify 上至今找不到，只能在网易云的精选集里听到。"], "sections": {"same_artist": {"same": [{"title": "LULLABY IN BLUE", "artist": "横山輝一", "album": "VOICE", "year": 1987, "spotify": "", "netease": "https://music.163.com/song?id=2055883736", "why": "和《Rainy Day》同一年、同一张《VOICE》里的另一张单曲，也是一首带蓝调心情的中慢板。网易云上同样来自精选集《Best Of Best : Early Kiichi》。Spotify 上没有。", "file_flac": "", "file_mp3": "/115/音乐库/寻声/20261031_Rainy Day/横山輝一 - LULLABY IN BLUE.mp3"}, {"title": "GET IT ON", "artist": "横山輝一", "album": "VOICE", "year": 1987, "spotify": "", "netease": "https://music.163.com/song?id=2055883735", "why": ttps://music.163.com/song?id=505203", "why": "像在：和《Rainy Day》同样在 80 年代中期、同样是浓厚的男声情歌。1986 年鈴木雅之单飞后的第一张单曲，作曲是大沢誉志幸，吉他是布袋寅泰，还当过日清合味道杯面的广告歌。", "file_flac": "", "file_mp3": "/115/音乐库/寻声/20261031_Rainy Day/鈴木雅之 - ガラス越しに消えた夏.mp3", "cover": "3lSLTFzHf56ELG3EkmP5uU.jpg"}, {"title": "流星のサドル", "artist": "久保田利伸", "album": "SHAKE IT PARADISE", "year": 1986, "spotify": "https://open.spotify.com/track/7KOKSe5FdrzVqStgJVcVv2", "netease": "https://music.163.com/song?id=447254", "why": "像在：同样是 80 年代日本男歌手唱黑人音乐的路子，比横山輝一出道晚几个月。出自久保田利伸 1986 年的出道专辑《SHAKE IT PARADISE》，后来又被剪成第二张单曲的 B 面，日文维基说它在歌迷和业内评价都很高。", "file_flac": "/115/音乐库/寻声/20261031_Rainy Day/久保田利伸 - 流星のサドル.flac", "file_mp3": "", "cover": "7KOKSe5FdrzVqStgJVcVv2.jpg"}], "step_out": {"roots": [{"title": "What You Won't Do for Love", "artist": "Bobby Caldwell", "album": "Bobby Caldwell", "year": 1978, "spotify": "https://open.spotify.com/track/6Dk5fHTvH897XrVzCO64Mx", "netease": "https://music.163.com/song?id=2207400", "why": "往回走：美国这边的源头之一。1978 年出道专辑的第一支单曲，铜管编曲很亮；他后来 1983 年的专辑《August Moon》甚至只在日本发行。这类 AOR 正是城市流行最常借的声音。", "file_flac": "/115/音乐库/寻声/20261031_Rainy Day/Bobby Caldwell - What You Won't Do for Love.flac", "file_mp3": "", "cover": "6Dk5fHTvH897XrVzCO64Mx.jpg"}, {"title": "Lowdown", "artist": "Boz Scaggs", "album": "Silk Degrees", "year": 1976, "spotify": "https://open.spotify.com/track/7pbmIuD1dm9UQiRjfHpf2E", "netease": "https://music.163.com/song?id=2062081968", "why": "往回走：1976 年《Silk Degrees》里的歌，拿了 1977 年格莱美最佳 R&B 歌曲。弹键盘、贝斯和鼓的三个人后来组了 Toto。英文维基说城市流行吸收了 AOR、软摇滚和放克——这首就是那种声音的样板。", "file_flac": "/115/音乐库/寻声/20261031_Rainy Day/Boz Scaggs - Lowdown.flac", "file_mp3": "", "cover": "7pbmIuD1dm9UQiRjfHpf2E.jpg"}], "next": [{"title": "Gift ～あなたはマドンナ～", "artist": "土岐麻子", "album": "Gift ～あなたはマドンナ～", "year": 2010, "spotify": "https://open.spotify.com/track/2fCHfs3Dai4DvNyiI7A1Ym", "netease": "https://music.163.com/song?id=657776", "why": "往后走：一条可能的线——《Rainy Day》的萨克斯手很可能是土岐英史（待核实），而土岐英史就是土岐麻子的父亲。这首是资生堂 ELIXIR 的广告歌，作曲是 80 年代城市流行歌手 EPO，广  City pop", "https://en.wikipedia.org/wiki/City_pop"]]}, {"id": "20261029-plasticlove", "date": "2026-10-29", "status": "done", "origin": "宣驰 10-28 08:19 在歌单「City Pop DJ Set」里点了寻声", "request_key": "2000-01-02|x1Z1fN0KFNu0aG2EpbBVwvN", "dest": "/115/音乐库/寻声/20261029_Plastic Love", "seed": {"title": "Plastic Love（プラスティック・ラブ）", "artist": "竹内まりや", "album": "VARIETY", "year": 1984, "spotify": "https://open.spotify.com/track/1Z1fN0KFNu0aG2EpbBVwvN", "netease": "https://music.163.com/song?id=659423", "cover": "1Z1fN0KFNu0aG2EpbBVwvN.jpg", "file_flac": "/115/音乐库/歌单/city-pop-dj-set/竹内まりや - Plastic Love.flac", "file_mp3": ""}, "hook": "欢快能跳的编曲，配一段很寂寞的歌词——放克贝斯和华丽铜管一路往前推，唱的却是一个失恋后把爱情当游戏的女人。这种「跳着舞的伤心」，就是它勾人的地方。", "listen": {"rhythm": "竹内まりや说她写这首时就想要「能跳舞的、16 拍的城市流行」：所谓 16 拍，就是鼓和贝斯按十六分音符细细地切，带着放克的弹性，一直推着人走。", "lead": "维基引用的乐评说，这首是「放克贝斯线加华丽铜管」再加上高飞的人声：贝斯在下面又跳又咬，铜管一齐吹的时候整首歌一下子亮起来。", "vocal": "大部分是日语，副歌里的「Don't worry」「I'm sorry」和结尾那句「I'm just playing games / I know it's plastic love / Dance to the plastic beat」是英文。曲子越欢快，歌词越寂寞：她说歌里的女人「失去了真正爱的人，甩不掉那份孤单」。", "production": "编曲、制作都是她的丈夫山下達郎，他也唱了和声；在东京银座的 Onkio Haus 录音、混音。1985 年作为 12 寸单曲发行时，还附了一版加长的俱乐部混音「Extended Club Mix」。", "genre": "City pop（城市流行）：70、80 年代日本经济最好的时候，把美国放克、灵魂乐、爵士混在一起的都市流行乐。维基说这首被看作这个曲风「最有名的例子」。"}, "story": ["《Plastic Love》收在 1984 年的专辑《VARIETY》里，是竹内まりや婚后停工一段时间后的「回归作」：这张专辑第一次全部由她自己写歌。录音时她正怀着孕，她说那时写歌「就是因为好玩」，想试试摇滚、民谣、乡村各种风格，写这首时就想要一首能跳舞的城市流行。", "1985 年 3 月它作为单曲发行，成绩却很一般：只排到 Oricon 第 86 名，卖了不到一万张，倒是在卡拉 OK 里常有人点。", "三十多年后它突然翻红：2010 年代末，一段 8 分钟的混音版被 YouTube 算法不停推荐，2019 年播放超过 2200 万次，到 2021 年超过 5500 万次，后来因为版权被下架。它和松原みき的《真夜中のドア》一起，把一大批年轻听众领进了城市流行。2018 年 Friday Night Plans 的翻唱打进 Oricon 第 30 名；2021 年原曲再版 12 寸黑胶，冲到 Oricon 第 5 名，还成了 2022 年日本卖得最好的黑胶单曲。"], "sections": {"same_artist": {"same": [{"title": "SEPTEMBER", "artist": "竹内まりや", "album": "Expressions (RCA Version)", "year": 1979, "spotify": "https://open.spotify.com/track/7BuxfPbJjtI8juuM3h18yA", "netease": "https://music.163.com/song?id=2683788884", "why": "1979 年的成名单曲，作曲、编曲是林哲司，靠 ac", "file_mp3": ""}, "hook": "一个唱 R&B 和灵魂乐出身的京都人，1982 年请来一整队美国顶级录音室乐手——勾住你的，多半是那股「美国灵魂乐的底子，日本城市流行的夜色」。", "listen": {"rhythm": "Discogs 给这张专辑《NO PROBLEM》打的风格标签是 Lovers Rock（英国的「情人雷鬼」，节奏松、很甜）、Soul 和 City Pop。专辑最后一首他还翻唱了雷鬼名曲《Many Rivers To Cross》，这张唱片的律动就在灵魂乐和雷鬼之间。", "lead": "唱片上的乐手名单很豪华：吉他有 David T. Walker，贝斯有 Nathan East、Freddie Washington，鼓是 Ndugu Chancler，打击乐是 Paulinho Da Costa，萨克斯有 Ernie Watts——都是给美国灵魂乐、爵士大牌录音的人。（Discogs 是整张专辑的名单，没写每首谁弹。）", "vocal": "上田正樹在日文维基里被称为「R&B・灵魂乐歌手」；他当时的唱片监制関屋薫，看中的正是他「沙哑的嗓音」（ハスキーな歌声），觉得它和洋气的旋律很配。", "production": "合成器是井上鑑——同一年代他也给寺尾聰的《ルビーの指環》编曲；和声是 Waters 家的姐妹 Julia 和 Maxine Waters。专辑 1982 年由 CBS/Sony 发行。", "genre": "日本城市流行里偏灵魂乐、偏雷鬼的一支：底子是美国 R&B，外面是八十年代初日本都市的夜色。"}, "story": ["上田正樹 1949 年生在京都，父亲是医生，他本来一心要考东京大学医学部。1966 年，朋友拉他穿着校服去看英国乐队 The Animals 的名古屋演唱会，坐在第一排的他被震住了，觉得「人生的答案在音乐里」，从此成绩一落千丈，转去大阪各地的歌厅、迪斯科舞厅学唱歌。", "1974 年他和乐队「上田正樹とサウス・トゥ・サウス」出道，是关西 R&B 的代表，1976 年解散后单飞。1982 年这张《NO PROBLEM》发行；同年的单曲《悲しい色やね》（作词康珍化、作曲林哲司）先在有线广播里火起来，到 1983 年成了他在日本最大的热门歌。", "后来他把舞台越走越远：1985 年登上了全球直播的「Live Aid」；2000 年和印尼歌手 Reza 合唱的《FOREVER PEACE》在印尼、马来西亚和韩国走红。《悲しい色やね》还被张国荣翻唱成粤语的《爱火》。"], "sections": {"same_artist": {"same": [{"title": "ナイト・トレイン・ツー・ザ・スカイ", "artist": "上田正樹 Masaki Ueda", "album": "NO PROBLEM", "year": 1982, "spotify": "https://open.spotify.com/track/5Lc9VZQUikCAWlHnpFkyj5", "netease": "https://music.163.com/song?id=1454263178", "why": "和《Mr. Piano Man》同一张专辑、前后挨着的一首，同一队美国乐手。他自己作词作曲、井上鑑编曲，后来被放在《悲しい色やね》单曲的 B 面。", "file_flac": "", "file_mp3": "/115/音乐库/寻声/20261029_Mr. Piano Man/上田正樹 - ナイト・トレイン・ツー・ザ・スカイ.mp3", "cover": "5Lc9VZQUikCAWlHnpFkyj5.jpg"}, {"title": "遙かなる河", "artist": "上田正樹 Masaki Ueda", "album": "NO PROBLEM", "year": 1982, "spotify": "https://open.spotify.com/track/373Ls1NUQF5wxdgWFwTxm5", "netease": "https://music.163.com/song?id=1454263180", "why": "专辑的最后一首：翻唱 Jimmy Cliff 的雷鬼名曲《Many Rivers To Cross》，配日文歌名。原曲在下面「往外走一步」里，可以对比着听。", "file_flac": "/115/音乐库/寻声/20261029_Mr. Piano Man/上田正樹 - 遙かなる河.flac", "file_mp3": "", "cover": "373Ls1NUQF5wxdgWFwTxm5.jpg 直细碎地往前推，牛铃时不时「咔」地插一下；贝斯线又粗又跳，跟鼓咬得很紧——所以曲子听着轻快，身体却会跟着点头。", "lead": "没有哪件乐器独占，是一锅「拼盘」：电吉他短促的拨弦、像猫叫一样的合成器、跳弓和拨弦的弦乐、亮晶晶的键盘快速琶音；到了桥段换萨克斯独奏接手，一路带到结尾。", "vocal": "人声故意做得又窄又「旧」，像隔着一台老电话在唱——他现场干脆把一部红色老电话装进麦克风唱主歌，就是为了还原唱片里这种 lo-fi 的声音。旋律很甜，歌词其实在讲分手、放不下旧情人：曲调和歌词是反着来的。", "production": "录音室里只有他一个人：作曲、所有乐器、制作都是 Cameron Lew 自己。全曲高光是乐评人叫作「Loretta build」的那段和弦推进（同、同、上、下），有乐评点名 2:41 是整张 EP 最好的瞬间。MV 也是他自己拍剪：在大阪拍、故意把画质做成八十年代录像带。", "genre": "维基把 Ginger Root 归为 indie soul，MusicBrainz 给这张 EP 打的标签是 bedroom pop、synth funk。他自己叫它「aggressive elevator soul」（很冲的电梯灵魂乐）：昭和城市流行（YMO、大貫妙子、高中正義、山下達郎）＋ Vulfpeck、Toro y Moi 那种美国卧室放克。"}, "story": ["2021 年夏天，Cameron Lew 给自己编了一个剧本：时间是 1981 年，他受邀为一部日本电影《街のやつ》的美国翻拍版写配乐——电影是虚构的，配乐却一首首做了出来，就是 EP《City Slicker》。《Loretta》6 月先作为单曲放出，排在第二轨。他后来说，那阵子自己正迷着八十年代昭和、泡沫时期的音乐，还在拼命学日语，「以前对我毫无意义的声音，突然有了意思」。", "MV 像一档八十年代的日本电视歌唱节目，台上一排乐手全是他本人的分身。这支视频被 YouTube 算法看中，几个月就冲到将近 300 万次播放，Ginger Root 的听众一下子翻了好几倍。他说自己完全没想到会到这个程度，但也不觉得这是「瓶中闪电」式的运气——之前每一张作品都是这样一点点做出来的。", "走红也有代价：他发现自己被当成了「美国版城市流行复兴」的代表，新粉丝都在等「下一首 Loretta」。所以 2024 年的专辑《SHINBANGUMI》里，他故意把保罗·麦卡特尼、Tower of Power、Vulfpeck、Devo 都揉了进去——「我还有比城市流行更多的话想说。」下面「同一个人」那一块，正好能听到这两面。"], "sections": {"same_artist": {"same": [{"title": "Better Than Monday", "artist": "Ginger Root", "album": "SHINBANGUMI", "year": 2024, "spotify": "https://open.spotify.com/track/1ffceMElfXAAoRSPRIBj8g", "netease": "https://music.163.com/song?id=2149652712", "why": "《SHINBANGUMI》发片前放出的单曲之一。还是跳跃的贝斯、亮键盘和八十年代电视感，最接近《Loretta》的那一路。", "file_flac": "/115/音乐库/寻声/20261028_Loretta/Ginger Root - Better Than Monday.flac", "file_mp3": "", "cover": "1ffceMElfXAAoRSPRIBj8g.jpg"}, {"title": "No Problems", "artist": "Ginger Root", "album": "SHINBANGUMI", "year": 2024, "spotify": "https://open.spotify.com/track/6qvkRSSx2JE3iFCi2KFZcq", "netease": "https://music.163.com/song?id=2149648305", "why": "同一张新专辑的先行单曲，律动更紧、更放克，副歌一样一听就记住。", "file_flac": "/115/音乐库/寻声/20261028_Loretta/Ginger Root - No Problems.flac", "file_mp3": "", "cover": "6qvkRSSx2JE3iFCi2KFZcq.jpg"}, {"title": "Le château", "artist": "Ginger Root", "album": "Rikki", "year": 2020, "spotify": "https://open.spotify.com/track/1EL99pT69gxqtenCwr5EyC", "netease": "https://music.163.com/song?id=1501170439", "why": "《Loretta》之前他最「红」的一首。那时还没走昭和路线，但轻快的卧室放克已经成形。", "file_flac": "/115/音乐库/寻声/20261028_Loretta/Ginger Root - Le château.flac", "file_mp3": "", "cover": "1EL99pT69gxqtenCwr5EyC.jpg"}], "other": [{"title": "Loretta (日本語 version)", "artist": "Ginger Root", "album": "Loretta (日本語 version)", "year": 2021, "spotify": "https://open.spotify.com/track/6jdZMmISOKaI2DwVyJRGc8", "netease": "https://music.163.com/song?id=1857286168", "why": "同一首歌，他自己改用日语唱。编曲几乎不变，换了语言更像真正的昭和歌谣——适合和原版对比着听。", "file_flac": "/115/音乐库/寻声/20261028_Loretta/Ginger Root - Loretta (日本語 version).flac", "file_mp3": "", "cover": "6jdZMmISOKaI2DwVyJRGc8.jpg"}, {"title": "Mahjong Room", "artist": "Ginger Root", "album": "Mahjong Room", "year": 2018, "spotify": "https://open.spotify.com/track/6A5hRb1BbHEzv51pk0yivf", "netease": "https://music.163.com/song?id=1501276248", "why": "早期作品，歌名来自他曾祖母家那间全家人打麻将的房间。更慢、更暖，是城市流行之前的另一面。", "file_flac": "/115/音乐库/寻声/20261028_Loretta/Ginger Root - Mahjong Room.flac", "file_mp3": "", "cover": "6A5hRb1BbHEzv51pk0yivf.jpg"}]}, "same_flavor": [{"title": "Be Sweet", "artist": "Japanese Breakfast", "album": "Jubilee", "year": 2021, "spotify": "https://open.spotify.com/track/0dpyzcT3RMNNSd2xKBf35I", "netease": "https://music.163.com/song?id=1823754173", "why": "像在：同样是八十年代合成器流行配放克贝斯，明亮、能跳。Ginger Root 也给 Japanese Breakfast 的巡演暖过场。", "file_flac": "/115/音乐库/寻声/20261028_Loretta/Japanese Breakfast - Be Sweet.flac", "file_mp3": "", "cover": "0dpyzcT3RMNNSd2xKBf35I.jpg"}, {"title": "Homage", "artist": "Mild High Club", "album": "Skiptracing", "year": 2016, "spotify": "https://open.spotify.com/track/7DcJ6fEBb7BaKuYKTwiDxK", "netease": "https://music.163.com/song?id=424995410", "why": "像在：爵士味的和弦、软绵绵的复古音色和一层旧录音的毛边，是更慵懒的那一版《Loretta》。", "file_flac": "/115/音乐库/寻声/20261028_Loretta/Mild High Club - Homage.flac", "f 06976", "why": "维基和日本唱片公司 P-VINE 都把 Toro y Moi 列为他的灵感来源：把迪斯科、放克做进卧室，《Loretta》的底子和这里相通。", "file_flac": "/115/音乐库/寻声/20261028_Loretta/Toro y Moi - Ordinary Pleasure.flac", "file_mp3": "", "cover": "0Dh7LsAuAyaaucEMD5ULHV.jpg"}], "next": [{"title": "Get Me", "artist": "Vicky Farewell", "album": "Sweet Company", "year": 2022, "spotify": "https://open.spotify.com/track/327NsyLHVmJM6QcKBKoGbS", "netease": "https://music.163.com/song?id=1936242911", "why": "Ginger Root 2022 年秋天巡演的暖场嘉宾，签在 Mac DeMarco 的厂牌。复古键盘配甜软人声的灵魂流行，是《Loretta》隔壁的邻居。", "file_flac": "/115/音乐库/寻声/20261028_Loretta/Vicky Farewell - Get Me.flac", "file_mp3": "", "cover": "327NsyLHVmJM6QcKBKoGbS.jpg"}, {"title": "フライディ・チャイナタウン (Night Tempo Showa Groove Mix)", "artist": "Night Tempo, 泰葉", "album": "泰葉 – Night Tempo presents ザ・昭和グルーヴ", "year": 2023, "spotify": "https://open.spotify.com/track/7sdBFqJHEnecbISOXexcSn", "netease": "https://music.163.com/song?id=2038428301", "why": "邻居曲风 future funk：Ginger Root 是「假装做一张 1981 年的配乐」，Night Tempo 的「昭和グルーヴ」系列则是把真正的昭和老歌（这里是泰葉的原曲）官方重混成舞曲——同一股昭和热，从另一头进来。", "file_flac": "/115/音乐库/寻声/20261028_Loretta/Night Tempo, 泰葉 - フライディ・チャイナタウン (Night Tempo Showa Groove Mix).flac", "file_mp3": "", "cover": "7sdBFqJHEnecbISOXexcSn.jpg"}]}}, "sources": [["维基百科：Ginger Root (music project)", "https://en.wikipedia.org/wiki/Ginger_Root_(music_project)"], ["WHUS Radio：Ginger Root, the Architect of “Aggressive Elevator Soul”", "https://whus.org/2022/01/ginger-root-the-architect-of-aggressive-elevator-soul/"], ["KTSW 89.9：Ginger Root Plays Brand New Setlist in Austin", "https://ktswblog.net/2021/10/19/ginger-root-plays-brand-new-setlist-in-austin/"], ["The Line of Best Fit 专访", "https://www.thelineofbestfit.com/features/interviews/ginger-root-miseducation-of-cameron-lew"], ["EnVi Media：Artist Spotlight", "https://envimedia.co/artist-spotlight-ginger-root-talks-sailor-moon-references-in-city-slicker-ep/"], ["MusicBrainz：City Slicker", "https://musicbrainz.org/release-group/2265d68e-a660-4823-a5fd-2e0a function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||"{}")||{};}catch(e){return {};}}

function saveRates(o){lsSet(LS_KEY,o);}
function loadQ(){return lsGet(LS_Q);}

function rateKey(date,id){return date+"|"+id;}

 var b=DAILY.filter(function(x){return x.date===date;})[0];if(!b)return null;
 return b.songs.filter(function(x){return x.id===id;})[0]||null;

function getRate(date,id){
 var o=loadRates(),v=o[rateKey(date,id)];
 if(v){return v.rating==null?null:v;}
 var s=songOf(date,id);
 if(s&&s.rating!=null)return {rating:s.rating,at:"",title:s.title,artist:s.artist,_fromData:1};
 return null;}
function mkRec(date,id,n,ts){
 var s=songOf(date,id)||{};
 return {rating:n,ts:ts,at:new Date(ts).toISOString(),title:s.title||"",artist:s.artist||"",spotify:s.spotify||"",netease:s.netease||"",cover:s.cover||"",album:s.album||"",year:s.year||"",intro:s.intro||"",genres:s.genres||[]};
}

 var ts=Math.max(Date.now(),prev&&prev.ts?prev.ts+1:0);
 o[k]=mkRec(date,id,n==null?null:n,ts);

/* ----- 同步状态点 ----- */
var syncState="idle",flushing=false,flushTimer=null,lastSyncAt=0;
function renderDot(){
 var el=document.getElementById("syncdot");if(!el)return;
 var n=Object.keys(loadQ()).length,txt,cls;
 if(n>0&&syncState==="offline"){txt="离线，稍后重试 ("+n+")";cls="off";}
 else if(n>0){txt="同步中…";cls="wait";}
 else if(syncState==="offline"){txt="未连上服务器";cls="off";}
 else {txt="已同步";cls="ok";}
 el.className="syncdot "+cls+(el.getAttribute("data-show")==="1"?" show":"");
 el.querySelector(".t").textContent=txt;
}
function showDot(on){var el=document.getElementById("syncdot");if(!el)return;el.setAttribute("data-show",on?"1":"0");el.classList.toggle("show",!!on);}
function scheduleFlush(ms){clearTimeout(flushTimer);flushTimer=setTimeout(flushQ,ms||15000);}
function flushQ(){
 if(flushing)return;
 var q=loadQ(),keys=Object.keys(q);
 if(!keys.length){renderDot();return;}
 flushing=true;renderDot();
 var o=loadRates(),i=0,failed=false;
 (function next(){
  if(i>=keys.length){flushing=false;if(failed){syncState="offline";scheduleFlush(15000);}else{syncState="idle";lastSyncAt=Date.now();}renderDot();return;}
  var k=keys[i++],v=o[k];
  if(!v){var q2=loadQ();delete q2[k];saveQ(q2);return next();}
  var sent=v.ts,body=JSON.stringify({key:k,date:k.slice(0,10),title:v.title||"",artist:v.artist||"",rating:v.rating==null?null:v.rating,ts:sent});
  fetch(SYNC_URL+"/rate",{method:"POST",headers:{"Content-Type":"application/json"},body:body,keepalive:body.length<60000}).then(function(r){
   if(r.ok||(r.status>=400&&r.status<500&&r.status!==429&&r.status!==408)){var q3=loadQ(),cur=loadRates()[k];if(!cur||cur.ts===sent)delete q3[k];saveQ(q3);}
   else failed=true;
   next();
  }).catch(function(){failed=true;next();});
 })();
}
/* ----- 拉取：以服务端为准，本地未同步的保留并重发 ----- */
function pullRatings(){
 var ctl=typeof AbortController!=="undefined"?new AbortController():null,tm=setTimeout(function(){if(ctl)ctl.abort();},12000);
 return fetch(SYNC_URL+"/ratings",{cache:"no-store",signal:ctl?ctl.signal:undefined}).then(function(r){if(!r.ok)throw new Error("http "+r.status);return r.json();}).then(function(d){
  clearTimeout(tm);
  var srv=(d&&d.ratings)||{},o=loadRates(),q=loadQ(),changed=0;
  Object.keys(srv).forEach(function(k){
   var sr=srv[k];if(!sr||typeof sr.ts!=="number")return;
   if(isXsKey(k)){xsMergeSrv(k,sr);return;}
   if(q[k])return; // 本地待发送，保留并重发
   var l=o[k];
   if(l&&l.ts>sr.ts){if(l.rating!==sr.rating){q[k]=1;return;}l.ts=sr.ts;return;} // 本地更新（未发出）→ 补发；评分相同则直接对齐时间戳
   if(!l||l.ts!==sr.ts||l.rating!==sr.rating){
    var id=k.slice(11);
    var rec=mkRec(k.slice(0,10),id,sr.rating==null?null:sr.rating,sr.ts);
    if(!rec.title)rec.title=sr.title||"";if(!rec.artist)rec.artist=sr.artist||"";
    o[k]=rec;changed++;
   }
  });
  Object.keys(o).forEach(function(k){ // 本地有、服务端没有 → 迁移上传
   if(!srv[k]&&!q[k]&&o[k]&&o[k].title){if(!o[k].ts)o[k].ts=Date.now();q[k]=1;}
  });
  saveRates(o);saveQ(q);
  syncState="idle";
  xsFlush();
  if(changed){rebuildRatedFromDaily();rerenderCurrent();}
  flushQ();renderDot();
 }).catch(function(){clearTimeout(tm);syncState="offline";renderDot();scheduleFlush(20000);});
}

function favPlayAll(){
 var list=[],seen={};
 favList().forEach(function(x){var f=filePaths(x.r);if(!f.any)return;var qid=f.flac||f.mp3||f.path;if(seen[qid])return;seen[qid]=1;list.push({qid:qid,title:x.r.title||"",artist:x.r.artist||"",mp3:f.mp3,flac:f.flac,path:f.path});});

var plSel=null,plId=null;
function playlist(id){
 var p=LIB.filter(function(x){return x.id===id;})[0];
 if(!p)return;
 plId=id;
 setTab("pl");document.title=p.name+" · Harmonia 的八音盒";
 var cnt={},first={},n=0;
 p.songs.forEach(function(s,i){(s.genres||[]).forEach(function(g,k){cnt[g]=(cnt[g]||0)+1;if(!(g in first))first[g]=i*10+k;});});
 var top=Object.keys(cnt).sort(function(a,b){return (cnt[b]-cnt[a])||(first[a]-first[b]);}).slice(0,4);
 if(plSel&&!cnt[plSel])plSel=null;
 var h='<div class="phead">'+plCover(p)+'<div>'+eyebrow("歌单")+'<h1>'+esc(p.name)+'</h1>'
  +'<div class="desc">'+esc(p.description)+'</div></div></div>';
 if(top.length){
  h+='<div class="gchips">'+top.map(function(g){return gChip(g,"lg"+(plSel===g?" sel":""),cnt[g]);}).join("")+'</div>';
  if(plSel)h+='<div class="gbar"><div class="gsel">已筛选「'+esc(plSel)+'」· 显示 '+cnt[plSel]+' / '+p.songs.length+' 首<button type="button" class="gclr" data-stop data-gclear>清除</button></div></div>';
  else h+='<div class="gbar">点标签筛选本歌单</div>';
 }
 h+='<div class="list">';
 p.songs.forEach(function(s,i){if(!plSel||(s.genres||[]).indexOf(plSel)>=0)h+=rowHtml(p,s,i,false);});
 app.innerHTML=h+'</div>';
}

/* ---------- 曲风科普（独立模块） ---------- */
var GG=DATA.library.genre_guides||{};
function gdNorm(x){return (x||"").toLowerCase().replace(/^和\s*/,"").replace(/[\s·.\-'’,&]/g,"");}
function gdTags(){return Object.keys(GG).sort(function(a,b){return (GCNT[b]||0)-(GCNT[a]||0);});}
function gdBanner(){
 var n=gdTags().length;if(!n)return"";
 return '<div class="gdbanner" data-gdgo="home"><div class="gi">曲</div><div class="gx"><b>曲风科普</b><span class="s">读懂收藏里的标签 · 已整理 '+n+' 种曲风</span></div><div class="ar">›</div></div>';
}
function gdFirst(t){var m=/^[^。！？]*[。！？]/.exec(t||"");return m?m[0]:(t||"");}
function genresHome(){
 setTab("gd");document.title="曲风科普 · Harmonia 的八音盒";
 var tags=gdTags(),all=Object.keys(GCNT).sort(function(a,b){return GCNT[b]-GCNT[a];});
 var h=eyebrow("读懂你的收藏")+'<h1>曲风科普</h1><div class="lead">已整理 '+tags.length+' 种 · 共 '+all.length+' 种标签</div><div class="gdlist">';
 tags.forEach(function(t){
  var g=GG[t],av=(g.artists||[]).filter(function(a){return a.img;}).slice(0,5).map(function(a){return '<span class="av"><img loading="lazy" decoding="async" alt="" src="'+a.img+'"></span>';}).join("");
  h+='<div class="gcard" data-gd="'+esc(t)+'"><div class="gh"><span class="gn">'+esc(t)+'</span><span class="gc">'+(GCNT[t]||0)+' 首在库里</span></div>'
   +'<div class="gs">'+esc(gdFirst(g.summary))+'</div>'+(av?'<div class="gav">'+av+'</div>':'')+'</div>';
 });
 h+='</div>';
 var rest=all.filter(function(t){return !GG[t];});
 if(rest.length)h+='<div class="gpendh">资料整理中（'+rest.length+'）</div><div class="gpend">'+rest.map(function(t){return '<span>'+esc(t)+'</span>';}).join("")+'</div>';
 app.innerHTML=h;
}
function gdLibAll(){
 var seen={},out=[];
 Object.keys(SONGS).forEach(function(k){var sg=SONGS[k],o=sg.s||sg.r;if(!o)return;var id=gdNorm(o.title)+"|"+gdNorm(o.artist);if(seen[id])return;seen[id]=1;out.push({k:k,o:o});});
 return out;
}
function gdArtistLink(name){
 var n=gdNorm(name),best=null;
 ARTISTS.forEach(function(a){var m=gdNorm(a.name);if(m&&(m===n||m.indexOf(n)>=0||(n.indexOf(m)>=0&&m.length>=3)))best=best||a;});
 return best;
}
function gdFace(imgSrc,name){return imgSrc?'<img loading="lazy" decoding="async" alt="" src="'+imgSrc+'">':esc((name||"?").replace(/^[^\w\u3040-\u30ff\u4e00-\u9fff]+/,"").charAt(0).toUpperCase());}
function genreGuide(tag){
 var g=GG[tag];if(!g)return;
 setTab("gd");document.title=tag+" · 曲风科普 · Harmonia 的八音盒";
 var lib=gdLibAll(),mine=lib.filter(function(x){return (x.o.genres||[]).indexOf(tag)>=0;});
 var libTitles=lib.map(function(x){return gdNorm(x.o.title);});
 function inLib(t){var n=gdNorm(t.replace(/[（(].*/,""));return n.length>=3&&libTitles.some(function(x){return x===n||x.indexOf(n)>=0;});}
 var h='<div class="gd">'+eyebrow("曲风科普")+'<h1>'+esc(tag)+'</h1><div class="lead">'+(mine.length?'你的库里有 '+mine.length+' 首':'你的库里暂时还没有')+'</div>';
 h+='<p class="gdsum">'+esc(g.summary)+'</p>';
 // 代表作品
 if((g.works||[]).length){
  h+='<div class="gdh">代表作品</div><div class="gworks">';
  g.works.forEach(function(w){h+='<div class="w"><span class="y">'+esc(w.year||"")+'</span><span class="tt">'+esc(w.title)+'<i>'+esc(w.artist)+'</i></span>'+(inLib(w.title)?'<span class="own">已在库里</span>':'')+'</div>';});
  h+='</div>';
 }
 // 歌手：已收藏 / 新面孔
 var own={},ownList=[];
 mine.forEach(function(x){var nm=x.o.artist.replace(/^和\s*/,"");var id=gdNorm(nm);if(!own[id]){own[id]={name:nm,cov:x.o,n:0};ownList.push(own[id]);}own[id].n++;});
 var fresh=[];
 (g.artists||[]).forEach(function(a){
  var hit=null;
  lib.forEach(function(x){if(hit)return;var m=gdNorm(x.o.artist);(a.alias||[]).forEach(function(al){var n=gdNorm(al);if(n&&(m===n||(n.length>=4&&m.indexOf(n)>=0)||(m.length>=4&&n.indexOf(m)>=0)))hit=x;});});
  if(hit){var id=gdNorm(hit.o.artist.replace(/^和\s*/,""));if(!own[id]){own[id]={name:hit.o.artist.replace(/^和\s*/,""),cov:hit.o,n:0};ownList.push(own[id]);}}
  else fresh.push(a);
 });
 function ownCard(a){
  var link=gdArtistLink(a.name),av=link?link.avatar:a.cov,cv=cover(av);
  return '<div class="ga own" data-go="'+esc(link?"a:"+link.name:"s:"+a.name)+'"><div class="face">'+cv+'</div><div class="nm">'+esc(a.name)+'</div><div class="bd">'+(a.n?a.n+' 首':'你已收藏')+'</div></div>';
 }
 if(ownList.length||fresh.length){
  h+='<div class="gdh">代表歌手</div>';
  if(ownList.length)h+='<div class="gsubh">你已收藏的歌手</div><div class="gagrid">'+ownList.map(ownCard).join("")+'</div>';
  if(fresh.length)h+='<div class="gsubh">值得认识的新面孔</div><div class="gagrid">'+fresh.map(function(a){return '<div class="ga new"><div class="face">'+gdFace(a.img,a.name)+'</div><div class="nm">'+esc(a.name)+'</div><div class="bd">新面孔</div></div>';}).join("")+'</div>';
 }
 // 推荐视频
 var vids=(g.works||[]).filter(function(w){return w.video&&!inLib(w.title);}).slice(0,4);
 if(vids.length){
  h+='<div class="gdh">推荐歌与视频</div><div class="live">';
  vids.forEach(function(w){var e=w.video;
   h+='<a class="lv" href="https://www.youtube.com/watch?v='+esc(encodeURIComponent(e.id))+'" target="_blank" rel="noopener noreferrer"><span class="thumb"><img loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" src="https://i.ytimg.com/vi/'+esc(encodeURIComponent(e.id))+'/hqdefault.jpg" onerror="this.remove()"><i class="pbtn"></i></span><span class="lbody"><span class="lt">'+esc(w.artist)+' · '+esc(w.title)+'</span><span class="lm">'+(w.year?esc(w.year)+' · ':'')+esc(e.channel||"YouTube")+'</span></span></a>';
  });
  h+='</div>';
 }
 // 库里已有的歌
 if(mine.length){
  h+='<div class="gdh">你库里的这类歌<small>'+mine.length+' 首</small></div>';
  mine.slice(0,4).forEach(function(x){h+='<div class="gmini" data-sk="'+esc(x.k)+'"><div class="cover">'+cover(x.o)+'</div><div class="info"><div class="t">'+esc(x.o.title)+'</div><div class="a">'+esc(x.o.artist)+'</div></div></div>';});
  h+='<button type="button" class="gmore" data-genre="'+esc(tag)+'">查看全部 '+mine.length+' 首 ›</button>';
 }
 var src=(g.sources||[]).map(function(s){return '<a href="'+esc(s.url)+'" target="_blank" rel="noopener noreferrer">'+esc(s.name)+'</a>';}).join(" · ");
 if(src)h+='<div class="gsrc">资料来源：'+src+'</div>';
 app.innerHTML=h+'</div>';
}

 if((m=/^#\/(?:playlist|p)\/(.+)$/.exec(h)))return {t:"pl",k:dec(m[1])};

window.npBindControls=function npBindControls(){
