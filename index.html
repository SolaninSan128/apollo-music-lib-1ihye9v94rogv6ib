<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Harmonia 的八音盒">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Harmonia 的八音盒</title>
<style>
:root{--bg:#f6f1e8;--card:#fffdf8;--card2:#efe7da;--text:#2a2118;--sub:#7b6f5f;--line:#e2d8c6;--accent:#d4512b;--accent-t:#fff;--gold:#a9780d;--sp:#17a24a;--sp-t:#fff;--ne:#d4402f;--dp:#a9780d;--dp-t:#fff;--shadow:0 1px 2px rgba(60,40,10,.06);--r:14px}
:root[data-theme=dark]{--bg:#14110d;--card:#1d1913;--card2:#28221a;--text:#f2eadd;--sub:#a99f8f;--line:#352d22;--accent:#e2663f;--accent-t:#1a0e08;--gold:#dbab3b;--sp:#1fbd5a;--sp-t:#04170b;--ne:#e5574a;--dp:#dbab3b;--dp-t:#1a1205;--shadow:0 1px 2px rgba(0,0,0,.45)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html,body{overflow-x:clip} /* 任何超宽内容都不许把页面横向撑宽：撑宽后手机把布局视口放大，底部固定的播放条会跑到屏幕中间 */
body{background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Noto Sans SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans JP",sans-serif;padding-bottom:env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
a{color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
.bar{max-width:1120px;margin:0 auto;padding:10px 16px 8px;display:flex;gap:8px;align-items:center}
.logo{font-weight:800;font-size:17px;white-space:nowrap;cursor:pointer;letter-spacing:.01em}
.logo::first-letter{color:var(--gold)}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 12px;font-size:13px}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:15px;padding:8px 2px}
.icon-btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:50%;width:36px;height:36px;font-size:15px;cursor:pointer;flex:none;display:inline-flex;align-items:center;justify-content:center;padding:0}
.reload-btn{flex:none}
.reload-btn svg{width:18px;height:18px;display:block;color:var(--gold)}
.reload-btn:active{transform:rotate(60deg);transition:transform .2s}
.logo-wrap{display:flex;align-items:center;gap:8px;flex:none}

main{max-width:1120px;margin:0 auto;padding:6px 16px 20px}
.eyebrow{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.14em;margin:14px 0 4px}
h1{font-size:30px;line-height:1.15;font-weight:800;letter-spacing:-.01em;margin:0 0 6px}
.lead{color:var(--sub);font-size:13.5px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.pl{display:flex;gap:14px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.pl:hover,.dday:hover,.ac:hover,.row:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.pl:active,.dday:active,.ac:active{transform:scale(.99)}
.pl .cover{width:112px;flex:none;aspect-ratio:1/1;align-self:flex-start;margin:12px 0 12px 12px;border-radius:10px}
.pl .body{padding:12px 14px 12px 0;min-width:0;flex:1}
.pl .name{font-weight:800;font-size:17px;line-height:1.3;margin-bottom:3px}
.meta{color:var(--sub);font-size:13px}
.desc{color:var(--sub);font-size:13px;margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cover{position:relative;width:100%;aspect-ratio:1/1;background:var(--card2);overflow:hidden}
.cover.collage{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.cover img,.ph{width:100%;height:100%;object-fit:cover;display:block}
.ph{display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.85);font-size:30px}
.back{border:0;background:none;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:6px 0;margin-bottom:6px}
.phead{display:flex;gap:14px;align-items:flex-start;margin:6px 0 14px}
.phead .cover{width:104px;flex:none;border-radius:12px}
.phead h1{margin:0 0 6px;font-size:26px}
.phead .meta a{color:var(--accent);text-decoration:none;font-weight:600}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
.row{position:relative;display:grid;grid-template-columns:var(--rc) minmax(0,1fr);gap:6px 14px;--rc:120px;align-items:start;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);cursor:pointer}
.row .cover{width:var(--rc);height:var(--rc);border-radius:12px;grid-row:1/3}
.row .ph{font-size:34px}
.row .info{grid-column:2}
.row .acts{grid-column:2;grid-row:2;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center;align-self:end}
.row .acts>.btn,.row .acts>.nebox{flex:0 0 auto;min-width:0}
.row .acts .btn:not(.b-dp-ico){height:28px;padding:0 13px;font-size:12.5px;font-weight:700;letter-spacing:.02em;box-shadow:0 1px 4px rgba(0,0,0,.28)}
.row .acts .btn.b-off,.row .acts .btn.b-yt{box-shadow:none}
.row .acts .b-dp-ico{width:40px;height:40px;min-width:40px}
.row .nehint{display:none}
@media(min-width:621px){.row{--rc:132px}}
.row .idx{position:absolute;left:20px;top:20px;z-index:1;min-width:20px;height:20px;line-height:20px;padding:0 6px;border-radius:6px;background:rgba(15,10,5,.72);color:#f6ecd9;font-weight:800;font-size:11px;text-align:center}
.info{min-width:0}
.t{font-weight:700;font-size:16px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.a{color:var(--text);opacity:.82;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.al{color:var(--sub);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.why{font-size:13px;line-height:1.5;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.why b{color:var(--gold);font-weight:800;margin-right:6px}
.acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.acts>.btn:not(.b-dp-ico),.acts>.nebox{flex:1 1 0;min-width:72px}
.acts>.b-dp-ico{flex:0 0 auto;min-width:40px;align-self:center}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap;border:1px solid transparent;cursor:pointer;font-family:inherit;line-height:1.2}
.b-sp{background:var(--sp);color:var(--sp-t)}
.b-ne{background:var(--ne);color:#fff}
.b-dp{background:var(--dp);color:var(--dp-t)}
.b-dp-ico{width:40px;height:40px;padding:0;border-radius:50%;background:var(--dp);color:var(--dp-t);box-shadow:0 2px 10px color-mix(in srgb,var(--dp) 45%,transparent);flex:0 0 auto!important;min-width:40px!important;border:0}
.b-dp-ico svg{width:20px;height:20px;display:block;margin-left:2px}
.b-dp-ico .dpi-pause{display:none;margin-left:0}
.b-dp-ico.is-playing .dpi-play{display:none}.b-dp-ico.is-playing .dpi-pause{display:block}
.b-dp-ico.is-loading{animation:dpLoad 1.4s ease-in-out infinite}
@keyframes dpLoad{0%,100%{opacity:1}50%{opacity:.62}}
@media (prefers-reduced-motion:reduce){.b-dp-ico.is-loading{animation:none;opacity:.8}}
.b-dp-ico:active:not(.b-dp-off){transform:scale(.94)}
.b-dp-ico.b-dp-off,.btn.b-dp-ico.b-dp-off{background:var(--card2);color:var(--sub);box-shadow:none;cursor:default;opacity:.72}
.b-yt{background:var(--card2);color:var(--text);border-color:var(--line)}
.b-off{background:var(--card2);color:var(--sub);cursor:default;font-weight:600}
.tm{font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;color:var(--sub);background:var(--card2);border-radius:6px;padding:1px 6px;margin-left:6px;font-weight:600}
.empty{color:var(--sub);padding:30px 10px;text-align:center}
.svbody .cover{width:min(300px,100%);margin:6px auto 16px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.svbody .eyebrow{margin:0 0 4px}
.svbody h2{margin:0 0 2px;font-size:25px;line-height:1.2;font-weight:800;letter-spacing:-.01em}
.svbody .meta{font-size:14.5px}
.svbody .meta a.artlink{color:inherit;text-decoration:none;border-radius:2px}
.svbody .meta a.artlink:hover .aname{text-decoration:underline;text-underline-offset:2px}
.svbody .meta a.artlink:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.svbody .meta a.artlink .spico{width:12px;height:12px;margin-left:4px;vertical-align:-2px;display:inline-block;color:var(--accent)}
.svbody .meta .artsep{opacity:.72}
dl{margin:14px 0;display:grid;grid-template-columns:64px 1fr;gap:6px 10px;font-size:14px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
dt{color:var(--gold);font-weight:700;font-size:13px}dd{margin:0}
.albtn{all:unset;box-sizing:border-box;cursor:pointer;color:var(--accent);font-weight:700;border-bottom:1px dashed color-mix(in srgb,var(--accent) 60%,transparent);padding:0 0 1px;line-height:1.5}
.albtn .chev{margin-left:5px;opacity:.8}
.albtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.asheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .18s}
.asheet.on{opacity:1;pointer-events:auto}
.apanel{width:100%;max-width:520px;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateY(24px);transition:transform .2s;box-shadow:0 -10px 40px rgba(0,0,0,.45)}
.asheet.on .apanel{transform:none}
.aeye{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.14em;margin-bottom:2px}
.atit{font-size:18px;font-weight:800;line-height:1.35;margin-bottom:14px;word-break:break-word}
.aopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.aopts .btn{padding:12px 10px;font-size:14.5px;white-space:normal;text-align:center}
.gt{appearance:none;-webkit-appearance:none;margin:0;font:inherit;cursor:pointer;display:inline-flex;align-items:center;height:21px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.03em;line-height:1;white-space:nowrap;color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 42%,transparent);background:transparent}
.gt:active{transform:scale(.97)}
.gt.lg{height:29px;padding:0 10px;gap:4px;font-size:12.5px}
.gt.lg i{font-style:normal;font-size:11px;font-weight:600;opacity:.62}
.gt.sel{background:color-mix(in srgb,var(--gold) 20%,transparent);border-color:var(--gold);color:color-mix(in srgb,var(--gold) 55%,#fff);font-weight:700}
span.gt.more{cursor:default;color:var(--sub);border-color:var(--line)}
.gts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gchips{display:flex;flex-wrap:nowrap;gap:6px;margin:2px 0 8px;overflow-x:auto;scrollbar-width:none}
.gchips::-webkit-scrollbar{display:none}
.gbar{min-height:20px;margin:0 0 12px;font-size:12px;color:var(--sub)}
.gsel{display:flex;align-items:center;gap:10px;color:var(--text)}
.gclr{appearance:none;-webkit-appearance:none;border:0;background:none;padding:0;font:inherit;cursor:pointer;color:var(--accent);font-weight:700;font-size:12px}
.gfull{grid-column:1/-1;margin:-2px 0 2px}.gfull .gts{margin-top:0}
.gline{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.note{background:var(--card2);border-radius:12px;padding:10px 12px;font-size:13.5px;margin:8px 0}
.note b,.intro-full b,.dintro b,.introbox .txt b{color:var(--gold)}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.links>.btn,.links>.nebox{flex:1 1 0;min-width:84px}
.npbar{position:fixed;left:0;right:0;bottom:0;z-index:70;-webkit-transform:translateZ(0);transform:translateZ(0);display:none;flex-direction:column;gap:4px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.25)}
.npbar.on{display:flex}
.npbar .nprow{display:flex;align-items:center;gap:8px;width:100%}
.npbar .npmeta{flex:1;min-width:0}
.npbar .npt{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npbar .npa{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npbar audio{position:absolute;width:0;height:0;opacity:0;pointer-events:none}
.npbar .npctrl{display:flex;align-items:center;justify-content:center;gap:2px;flex:none}
.npbar .npb{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:var(--text);cursor:pointer;padding:6px;margin:0;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;line-height:0}
.npbar .npb:active{transform:scale(.92);opacity:.85}
.npbar .npb svg{width:22px;height:22px;display:block;fill:currentColor}
.npbar .npb.np-play svg{width:30px;height:30px}
.npbar .npx{border:0;background:transparent;color:var(--sub);font-size:18px;cursor:pointer;padding:4px 6px;flex:none;line-height:1}
.npbar .npseek{display:flex;align-items:center;gap:8px;width:100%;padding:0 2px}
.npbar .nptm{font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums;flex:none;min-width:34px}
.npbar .nptm.r{text-align:right}
.npbar .nptrack{flex:1;min-width:0;height:28px;display:flex;align-items:center;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none}
.npbar .npfill-bg{position:relative;width:100%;height:4px;border-radius:999px;background:var(--line)}
.npbar .npfill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;background:var(--accent);pointer-events:none}
.npbar .npknob{position:absolute;top:50%;width:12px;height:12px;margin-top:-6px;margin-left:-6px;left:0;border-radius:50%;background:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.35);pointer-events:none;opacity:0;transition:opacity .12s}
.npbar .nptrack:active .npknob,.npbar.seeking .npknob{opacity:1}
body.has-np{padding-bottom:calc(112px + env(safe-area-inset-bottom))}
body{padding-bottom:max(28px,env(safe-area-inset-bottom))}
/* 播放条：始终贴视口最底、压在详情页/弹层之上；各滚动区底部留出播放条高度（--npH 由脚本实测） */
body.has-np{padding-bottom:calc(var(--npH,112px) + 16px)}
body.has-np .svbody{padding-bottom:calc(var(--npH,112px) + 24px)}
body.has-np .apanel{padding-bottom:calc(var(--npH,112px) + 18px)}
body.has-np .toast{bottom:calc(var(--npH,112px) + 12px)}
@media(max-width:620px){
 h1{font-size:28px}
 .phead .cover{width:84px}
 .phead h1{font-size:22px}
 .logo span{display:none}
 .grid,.list{grid-template-columns:1fr}
}
.hback{display:none;flex:none;align-items:center;justify-content:center;padding:0}
.hback.show{display:inline-flex}
.hback svg{width:20px;height:20px;display:block}
.sv{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;transform:translateX(100%);visibility:hidden}
.sv.on{transform:none;visibility:visible}
.sv.anim{transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s linear .26s}
.sv.on.anim{transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s}
.svbar{position:sticky;top:0;z-index:2;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 8px;display:flex;align-items:center;gap:10px}
.svbar .svt{flex:1;min-width:0;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.svbody{max-width:560px;margin:0 auto;padding:6px 16px calc(env(safe-area-inset-bottom,0px) + 40px)}
@media(prefers-reduced-motion:reduce){.sv.anim,.sv.on.anim{transition:none}}
.tabs{max-width:1120px;margin:0 auto;padding:0 16px 10px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.tab{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:999px;padding:6px 16px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.tab.on,.tab-daily.on{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.avatar{width:100%;aspect-ratio:1/1;border-radius:0}
.ac .cover img,.ac .cover .ph,.phead .cover.artist-av img{object-fit:cover}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.ac{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.ac .body{padding:10px 12px 12px}
.ac .name{font-weight:800;line-height:1.3;margin-bottom:2px}
@media(max-width:620px){.agrid{grid-template-columns:repeat(2,1fr);gap:10px}}
.phead .cover.artist-av{border-radius:50%;width:92px}
.chips{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:999px;padding:5px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.rt{display:inline-block;border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:800;margin-right:6px}
.rt1{background:var(--sp);color:var(--sp-t)}
.rt2{background:#d4a017;color:#1a1400}
.row.col .nehint{display:none}
.row.col .why{font-size:12.5px;line-height:1.5;margin-top:5px;color:var(--sub)}
.row.col .why b{font-size:12px}
.al2{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:12px;margin-top:3px}
.al2 .rt{margin:0;padding:0 8px;font-size:11px;line-height:18px}
.introbox{grid-column:1/-1;border-top:1px solid var(--line);margin-top:6px;padding-top:4px}
.row.col .introbox details{background:none;border-radius:0;padding:6px 0;font-size:13px}
.row.col .introbox details+details{border-top:1px solid var(--line)}
.row.col .introbox summary{font-size:12.5px;font-weight:700}
.row.col .introbox .ldet summary{color:var(--sub)}
.row.col .introbox .txt{font-size:13px;margin-top:4px}
.row.col .introbox details[data-stop]{margin-top:0!important}
.introbox details,.dintro details{background:var(--card2);border-radius:12px;padding:8px 12px;font-size:13.5px}
.introbox summary,.dintro summary{cursor:pointer;color:var(--gold);font-weight:700}
.introbox .txt{margin-top:6px;white-space:normal;line-height:1.65}
.live{margin-top:8px}.live .lh{font-weight:800;font-size:13.5px;margin:0 0 6px;color:var(--gold)}
.live a.lv{display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px;align-items:start;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px;margin:0 0 8px;text-decoration:none;color:inherit}
.live .thumb{position:relative;display:block;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:linear-gradient(135deg,#3b3025,#1c1610)}
.live .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

var LinkKit=(function(){
 function neId(u){var m=/[?&]id=(\d+)/.exec(u||"");return m?m[1]:"";}
  function spId(u){var m=/track\/([A-Za-z0-9]+)/.exec(u||"");return m?m[1]:"";}
 /* app: phone/tablet scheme (autoplay); web: mobile fallback page; desk: desktop web player page (PC client has no reliable song scheme) */
 function neLinks(u){var id=neId(u);return id?{app:"orpheus://song/"+id+"/?autoplay=1",web:"https://music.163.com/song?id="+id,desk:"https://music.163.com/#/song?id="+id}:null;}

 function neAlbumLinks(u){var id=neAlId(u);return id?{app:"orpheus://album/"+id,web:"https://music.163.com/album?id="+id,desk:"https://music.163.com/#/album?id="+id}:null;}
 function spAlbumLinks(u){var id=spAlId(u);return id?{app:"spotify:album:"+id,web:"https://open.spotify.com/album/"+id}:null;}
 function isMobile(nav){var ua=(nav&&nav.userAgent)||"";return /Android|iPhone|iPad|iPod/i.test(ua)||((nav&&nav.maxTouchPoints>1)&&/Mac/.test((nav&&nav.platform)||""));}
 /* env: {win, doc, nav, setTimeout, clearTimeout}; returns cancel() */
 function launch(env,app,web,wait){
  var left=false,done=false,w=env.win,d=env.doc;
  function mark(){left=true;}
  function vis(){if(d.hidden||d.visibilityState==="hidden")left=true;}
  function cleanup(){if(done)return;done=true;w.removeEventListener("blur",mark);w.removeEventListener("pagehide",mark);d.removeEventListener("visibilitychange",vis);}
  w.addEventListener("blur",mark);w.addEventListener("pagehide",mark);d.addEventListener("visibilitychange",vis);
  var timer=env.setTimeout(function(){
   var stayed=!left&&!d.hidden&&d.visibilityState!=="hidden";
   cleanup();
   if(stayed){var nw=null;try{nw=w.open(web,"_blank","noopener");}catch(e){}if(!nw){w.location.href=web;}}
  },wait||1800);
  try{w.location.href=app;}catch(e){}
  return function(){env.clearTimeout(timer);cleanup();};
 }
 /* decide for a clicked anchor; returns true if handled (caller must preventDefault) */
 function handle(env,kind,href){

})();

: "B面珍宝"}], "daily_artists": [{"date": "2026-10-31", "name": "陶喆", "name_native": "陶喆", "name_zh": "陶喆", "name_en": "David Tao", "badge": "最近大火", "artist_type": 3, "artist_type_name": "最近大火", "kind": "hot", "region": "华语", "meta": "台湾 · 创作歌手、制作人 · 1969 年生于香港 · 1997 年出道", "why": "今天轮到「最近大火」：隔了 12 年，陶喆 2025 年发了新专辑《STUPID POP SONGS》，2024 年开始的 Soul Power II 世界巡演到今年 6 月已经唱满 100 场，他自己说这轮巡演超过了过去所有巡演的纪录。被叫作华语「R&B 教父」的人，新专辑里还有一首他自己说「有人会叫它 City-Pop」的《Moonchild》——正好接上你这几周一直在听的城市流行。", "photo": "daily_artist/20261031_davidtao_apple.jpg", "photo_credit": "照片：Apple Music", "stats": [["6 座", "金曲奖（英文维基）"], ["50 万张", "1997 年首张专辑的台湾销量"], ["100 场", "Soul Power II 世界巡演（2026 年 6 月收官）"]], "in_library": [], "story": {"paragraphs": ["陶喆 1969 年生在香港，父亲陶大伟是台湾的歌手、演员，母亲是京剧演员。他小时候在台北读书，十几岁随家人去了加州，后来父母回台湾，他一个人留在美国读书打工：当过家教、在鞋店乐器行上班，在洛杉矶警察局做过文职，还在好莱坞电影《黑雨》里客串过一个日本警察。最后从加州大学洛杉矶分校心理学系毕业。", "1993 年春天，他在洛杉矶的一家乐器行碰到制作人王治平，被劝回台湾，先在幕后给别人写歌、做专辑。1997 年他转到台前，一家叫「俠客」的新唱片公司据说就是为他成立的。首张专辑《陶喆》整张在他洛杉矶家里做成，**在台湾卖了 50 万张**，第二年拿下金曲奖最佳新人和最佳唱片制作人，是第一个新人就拿制作人奖的。1999 年的《I'm OK》全亚洲卖了 200 万张。", "他把美国 R&B 的唱法和编曲带进华语流行，又爱「老歌新编」：《望春风》《夜来香》《月亮代表谁的心》都被他改成了 R&B；《太平盛世》里的《Susan 说》还把京剧《苏三起解》揉了进去。他前后一共拿过 6 座金曲奖。", "然后是一段很长的安静。直到 2024 年 Soul Power II 世界巡演开唱，2025 年 3 月 14 日先发单曲《Stupid Pop Song》，4 月发出 12 年来第一张新专辑《STUPID POP SONGS》，中文叫「普普愚乐」。巡演一路加场，2026 年又排了广州、重庆各三晚，6 月他发文说：三四年前很多人包括他自己都不看好这次巡演，如今已经**圆满百场**。"], "sources": [["维基百科：陶喆", "https://zh.wikipedia.org/wiki/%E9%99%B6%E5%96%86"], ["Wikipedia: David Tao", "https://en.wikipedia.org/wiki/David_Tao"], ["Apple Music：STUPID POP SONGS（陶喆逐曲自述）", "https://music.apple.com/cn/album/stupid-pop-songs/1807733204"], ["一事無成的老編：陶喆白色情人節獻上最新單曲〈Stupid Pop Song〉", "https://benlinmarketing.com/2025/03/14/dtsps/"], ["kismetw：陶喆《STUPID POP SONGS》发行", "https://kismetw.com/stupidpopsong-release/"], ["陶喆微博（新浪新闻转载，2026-06-03）：巡演百场收官", "https://www.sina.cn/news/detail/5305792216958042.html"], ["大麦微博（新浪新闻转载，2026-03-06）：SOUL POWER II PLUS 广州、重庆站", "https://www.sina.cn/news/detail/5273551147893375.html"]]}, "s 道单曲《I Bet You Look Good on the Dancefloor》直接拿下英国第一。2006 年首张专辑一周卖出 363,735 张，成了**英国史上卖得最快的首张专辑**，第一天的销量就超过排行榜前 20 名其余所有专辑的总和，还拿下当年的水星音乐奖。几乎没做宣传就这么红，被很多人看作「新乐队靠互联网出头」的开端。", "之后他们没停在原地：第三张《Humbug》跑去美国沙漠，请 Queens of the Stone Age 的 Josh Homme 当制作人，声音变得又重又迷幻；2013 年的《AM》把嘻哈鼓点和 70 年代硬摇滚揉在一起，Turner 的形容是「一段 Dr. Dre 的节拍，给它剪个 Ike Turner 的锅盖头，让它骑着电吉他在沙漠里狂奔」。这张专辑让他们成了第一支连续五张专辑首周登顶英国榜的独立厂牌乐队，也在美国卖到四白金。", "2018 年以后他们换成钢琴主导、像老派酒店酒廊的声音，《Tranquility Base Hotel & Casino》和《The Car》都提名了格莱美。可真正把他们推成「现象」的，是新一代听众：《505》2022 年在 TikTok 上翻红，《I Wanna Be Yours》今年 9 月在 Spotify 上突破 50 亿次播放。Esquire 写过，一个乐队能定义一个时代已经很少见，Arctic Monkeys 做到了两次。"], "sources": [["Wikipedia: Arctic Monkeys", "https://en.wikipedia.org/wiki/Arctic_Monkeys"], ["Wikipedia: Do I Wanna Know?", "https://en.wikipedia.org/wiki/Do_I_Wanna_Know%3F"], ["Wikipedia: I Wanna Be Yours", "https://en.wikipedia.org/wiki/I_Wanna_Be_Yours_(Arctic_Monkeys_song)"], ["Wikipedia: 505 (song)", "https://en.wikipedia.org/wiki/505_(song)"], ["Wikipedia: I Bet You Look Good on the Dancefloor", "https://en.wikipedia.org/wiki/I_Bet_You_Look_Good_on_the_Dancefloor"]]}, "songs": [{"title": "Do I Wanna Know?", "album": "AM", "year": 2013, "netease_id": 27737230, "cover": "daily_artist/ne_2669255.jpg", "starter": true, "why": "《AM》的开场曲，靠一段慢吞吞、一步一跺脚的吉他 riff 撑起整首歌，《Guitar World》把它评为 2010 年代第三好的吉他 riff。这是他们第一首打进美国 Billboard Hot 100 的歌，也是在美国真正翻身的一首；Spotify 播放超过 30 亿次，MV 在 YouTube 上有 18 亿次观看。", "artist": "Arctic Monkeys", "netease": "https://music.163.com/song?id=27737230", "file_flac": "/115/音乐库/每日歌手/20261030_Arctic Monkeys/Arctic Monkeys - Do I Wanna Know_.flac", "file_mp3": "", "dest": "/115/音乐库/每日歌手/20261030_Arctic Monkeys/", "youtube": "https://www.youtube.com/watch?v=bpOSxM0rNPM"}, {"title": "I Wanna Be Yours", "album": "AM", "year": 2013, "netease_id": 27737241, "cover": "daily_artist/ne_2669255.jpg", "starter": true, "why": "《AM》的最后一首，歌词改编自英国朋克诗人 John Cooper Clarke 1982 年的同名诗（「我想当你的吸尘器，吸进你的灰尘」）。它从没发过单曲，却在 2026 年 9 月成了 Spotify 播放 50 亿次的歌——今天把他们放进「现象级」，这首就是最直接的理由。", "artist": "Arctic Monkeys", "netease": "https://music.163.com/song?id=27737241", "file_flac": "/115/音乐库/每日歌手/20261030_Arctic Monkeys/Arctic Monkeys - I Wanna Be Yours.flac", "file_mp3": "", "dest": "/115/音乐库/每日歌手/20261030_Arctic Monkeys/", "youtube": "https://www.youtube.com/watch?v=nyuo9-OjNNg"}, {"title": "505", "album": "Favourite Worst Nightmare", "year": 2007, "netease_id": 16502047, "cover": "daily_artist/ne_1523046.jpg", "starter": true, "why": "2007 年第二张专辑的收尾曲，当年在英国单曲榜只排到第 74 名；2022 年在 TikTok 上突然翻红，成了那年英国最大的独立摇滚歌。Alex Turner 说这是他们「第一首真正的情歌」；风琴是他自己弹的，吉他请了好友 Miles Kane。YouTube 链接是 2018 年皇家阿尔伯特音乐厅的官方现场录音。", "artist": "Arctic Monkeys", "netease": "https://music.163.com/song?id=16502047", "file_flac": "/115/音乐库/每日歌手/20261030_Arctic Monkeys/Arctic Monkeys - 505.flac", "file_mp3": "", "dest": "/115/音乐库/每日歌手/20261030_Arctic Monkeys/", "youtube": "https://www.youtube.com/watch?v=Ao4BLUpX8VM"}, {"title": "I Bet You Look Good On The Dancefloor", "album": "Whatever People Say I Am, That's What I'm Not", "year": 2006, "netease_id": 16502024, "cover": "daily_artist/ne_1523045.jpg", "starter": false, "why": "2005 年 10 月的出道单曲，一发行就直接拿下英国单曲榜第一。开头那句「Don't believe the hype!」（别信那些吹捧）成了他们的招牌；歌词里「你的名字不叫 Rio」是在调侃 Duran Duran 的《Rio》。", "artist": "Arctic Monkeys", "netease": "https://music.163.com/song?id=16502024", "file_flac": "/115/音乐库/每日歌手/20261030_Arctic Monkeys/Arctic Monkeys - I Bet You Look Good On The Dancefloor.flac", "file_mp3": "", "dest": "/115/音乐库/每日歌手/20261030_Arctic Monkeys/", "youtube": "https://www.youtube.com/watch?v=pK7egZaT3hs"}, {"title": "Fluorescent Adolescent", "album": "Favourite Worst Nightmare", "year": 2007, "netease_id": 16502040, "cover": "daily_artist/ne_1523046.jpg", "starter": false, "why": "第二张专辑的单曲，英国榜第 5 名，唱的是感情变淡、怀念从前、慢慢变老。第一次现场演出是在乔纳森·罗斯的电视节目上，四个人全扮成了小丑。", "artist": "Arctic Monkeys", "netease": "https://music.163.com/song?id=16502040", "file_flac": "/115/音乐库/每日歌手/20261030_Arctic Monkeys/Arctic Monkeys - Fluorescent Adolescent.flac", "file_mp3": "", "dest": "/115/音乐库/每日歌手/20261030_Arctic Monkeys/", "youtube": "https://www.youtube.com/watch?v=ma9I9VBKPiw"}], "songs_note": "5 首都已下到你的网盘，点金色按钮就能直接放。", "albums": [{"title": "Whatever People Say I Am, That's What I'm Not", "year": 2006, "cover": "daily_artist/ne_1523045.jpg", "desc": "出道专辑，当年英国史上卖得最快的首张专辑，拿下水星音乐奖和全英音乐奖最佳英国专辑。唱的是谢菲尔德年轻人的夜店和街头。"}, {"title": "AM", "year": 2013, "cover": "daily_artist/ne_2669255.jpg", "desc": "嘻哈鼓点加硬摇滚吉他，他们在全世界最红的一张：有《Do I Wanna Know?》和《I Wanna Be Yours》，美国四白金，NME 给了满分。"}, {"title": "The Car", "year": 2022, "cover": "daily_artist/ne_153550661.jpg", "desc": "钢琴、弦乐和放克味的慢歌，和早期完全两样；提名格莱美最佳另类专辑和水星音乐奖，NME 评为当年最佳专辑。"}], "awards": [["2005", "出道单曲《I Bet You Look Good on the Dancefloor》直接拿下英国单曲榜第一"], ["2006", "首张专辑首周 363,735 张，创英国首张专辑最快销售纪录；获水星音乐奖"], ["2007–2008", "连续两年在全英音乐奖同时拿下最佳英国专辑和最佳英国乐队"], ["2012", "在伦敦奥运会开幕式上演出"], ["2013", "《AM》首周登顶，成为第一支连续五张专辑首周拿英国第一的独立厂牌乐队"], ["2014", "《AM》获全英音乐奖最佳英国专辑——他们第三次同时拿下最佳乐队和最佳专辑"], ["2023", "《The Car》提名水星音乐奖，他们的第五次提名，与 Radiohead 并列最多；第三次担任格拉斯顿伯里音乐节头牌"], ["2026", "《I Wanna Be Yours》9 月在 Spotify 上突破 50 亿次播放"]], "influences": {"from": [{"name": "The Strokes", "desc": "Turner 说：「我就想成为 The Strokes 的一员」，为此留长了头发、借了妈妈的西装外套"}, {"name": "John Cooper Clarke", "desc": "英国朋克诗人，对 Turner 写词影响很深；《I Wanna Be Yours》就改编自他的诗"}, {"name": "Josh Homme（Queens of the Stone Age）", "desc": "《Humbug》的制作人，把他们带进更重、更迷幻的沙漠摇滚"}], "to": [{"name": "Fontaines D.C.、black midi", "desc": "英文维基列出的受他们影响的新一代英国和爱尔兰乐队"}, {"name": "The 1975、Wallows、Sam Fender", "desc": "同样在受影响名单里的流行摇滚和唱作人"}, {"name": "Måneskin、Bring Me the Horizon", "desc": "影响一直延伸到意大利的摇滚乐队和英国的金属核乐队"}]}, "live": [{"title": "I Bet You Look Good on the Dancefloor（2012 伦敦奥运会开幕式）", "yt": "DKtoUQLzOPA", "url": "https://www.youtube.com/watch?v=DKtoUQLzOPA", "thumb": "daily_artist/yt_DKtoUQLzOPA.jpg", "src": "Olympics 官方频道", "desc": "2012 年 7 月 27 日伦敦奥运会开幕式，他们在全世界观众面前唱出道单曲。"}, {"title": "I Bet You Look Good on the Dancefloor（Glastonbury 2013）", "yt": "c-wwK5QVv1Y", "url": "https://www.youtube.com/watch?v=c-wwK5QVv1Y", "thumb": "daily_artist/yt_c-wwK5QVv1Y.jpg", "src": "BBC Music", "desc": "2013 年《AM》发行前夕，他们在格拉斯顿伯里音乐节金字塔舞台当头牌。"}, {"title": "505（Reading Festival 2022）", "yt": "bhk-yqnGlpM", "url": "https://www.youtube.com/watch?v=bhk-yqnGlpM", "thumb": "daily_artist/yt_bhk-yqnGlpM.jpg", "src": "BBC Music", "desc": "2022 年雷丁音乐节压轴，《505》正是这一年在 TikTok 上翻红的。"}], "live_note": {"text": "更多现场和 MV 在官方频道", "link": ["Official Arctic Monkeys", "https://www.youtube.com/watch?v=bpOSxM0rNPM"]}, "trivia": ["早期乐队的 MySpace 主页是歌迷替他们开的，被问起时他们说自己都不知道 MySpace 是什么。", "英国小报《Daily Star》报道他们签了百万英镑大约，乐队在官网否认，还把这家报纸改叫「The Daily Stir」（搅局日报）。", "首张专辑封面是朋友 Chris McClure 叼着烟的照片，被苏格兰国民医疗服务体系的负责人批评「让人觉得抽烟没事」。", "《Fluorescent Adolescent》第一次现场演出，是在乔纳森·罗斯的电视节目上，四个人全扮成小丑。", "Turner 形容《AM》：「一段 Dr. Dre 的节拍，给它剪个 Ike Turner 的锅盖头，让它骑着 Stratocaster 电吉他在沙漠里狂奔」。", "英国朋克诗人 John Cooper Clarke 说他们是「最接近披头士的东西」；Bob Dylan 也说过会「特意」去看他们的现场。"]}, {"date": "2026-10-29", "name": "中島みゆき Miyuki Nakajima", "name_native": "中島みゆき", "name_zh": "中岛美雪", "name_en": "Miyuki Nakajima", "badge": "跨时代经典", "artist_type": 1, "artist_type_name": "跨时代经典", "kind": "classic", "region": "日本", "meta": "日本 · 创作歌手 · 1952 年生于北海道札幌 · 1975 年出道", "why": "今天轮到「跨时代经典」：从 1970 年代唱到 2000 年代，她是在四个年代都拿过 Oricon 单曲冠军的人。昨天的每日歌手王菲，第一首大热歌《容易受伤的女人》原曲就是她写的《ルージュ》，王菲还翻唱过她的《悪女》。10 月 26 日的每日歌手松任谷由実和她同一个时代，日本媒体常把两人并称为「月亮与太阳」。", "photo": "daily_artist/20261029_nakajima_apple.jpg", "photo_credit": "照片：Apple Music", "stats": [["2100 万张以上", "唱片总销量估计（英文维基）"], ["4 个年代", "1970 到 2000 年代，每个年代都有 Oricon 单曲冠军"], ["174 周", "《地上の星》连续停留在 Oricon 单曲榜前 100 名的周数"]], "in_library": [], "story": {"paragraphs": ["1952 年她生在札幌。高三那年（1969 年）的校园文化祭，她第一次上台：那时女生上台就会被起哄，台下还扔卫生纸，她硬是把自己写的《鶫の唄》唱完了。下台时，一个从没说过话的女同学跑过来说「你太厉害了」——她后来说，这就是自己唱歌的起点。", "1975 年她凭《時代》拿下雅马哈的「ポプコン」大赛和世界歌谣祭大奖，被雅马哈的川上源一发掘。她一直把川上当作父亲一样的老师，直到今天，她每张专辑的制作名单里都写着「DAD 川上源一」。1977 年《わかれうた》卖了 70 多万张，成了她第一首冠军；1981 年的《悪女》、1982 年的专辑《寒水魚》（当年 Oricon 年度专辑第一）把人气推到顶点。她也一直替别人写歌，1983 年给柏原芳恵写的《春なのに》拿了日本唱片大奖作曲奖。", "80 年代中期她的销量往下走，一直在换声音、换写法，后来她自己把这几年叫作「御乱心の時代」（发疯的年代），其间单曲《つめたい別れ》还请来 Stevie Wonder 吹口琴。1988 年遇到编曲兼制作人**瀬尾一三**后才安定下来，此后她所有原创专辑都由他编曲；1989 年起，她每年 12 月在东京上演把戏剧和演唱会合在一起的舞台「夜会」，成了她的毕生之作。", "2000 年的《地上の星》本来没什么动静，2002 年她第一次上红白歌会、从黑部水电站的地下通道直播演唱，那一段收视率高达 52.8%；转年 1 月这首在发行 130 周后登上第一，她也因此成了 70 年代到 2000 年代四个年代都有冠军单曲的人。1992 年专辑里的 B 面歌《糸》在 2010 年代翻红，2017 年拿下 JASRAC 金奖。她 2009 年获紫绶褒章，1999 年还当过文部省国语审议会的委员——在这个委员会里，创作歌手只有她一个。"], "sources": [["Wikipedia（日文）：中島みゆき", "https://ja.wikipedia.org/wiki/%E4%B8%AD%E5%B3%B6%E3%81%BF%E3%82%86%E3%81%8D"], ["Wikipedia: Miyuki Nakajima", "https://en.wikipedia.org/wiki/Miyuki_Nakajima"], ["Wikipedia（日文）：地上の星", "https://ja.wikipedia.org/wiki/%E5%9C%B0%E4%B8%8A%E3%81%AE%E6%98%9F"], ["Wikipedia（日文）：糸 (中島みゆきの曲)", "https://ja.wikipedia.org/wiki/%E7%B3%B8_(%E4%B8%AD%E5%B3%B6%E3%81%BF%E3%82%86%E3%81%8D%E3%81%AE%E6%9B%B2)"], ["Wikipedia（日文）：悪女 (中島みゆきの曲)", "https://ja.wikipedia.org/wiki/%E6%82%AA%E5%A5%B3_(%E4%B8%AD%E5%B3%B6%E3%81%BF%E3%82%86%E3%81%8D%E3%81%AE%E6%9B%B2)"], ["Wikipedia（日文）：わかれうた", "https://ja.wikipedia.org/wiki/%E3%82%8F%E3%81%8B%E3%82%8C%E3%81%86%E3%81%9F"], ["Wikipedia（日文）：時代 (中島みゆきの曲)", "https://ja.wikipedia.org/wiki/%E6%99%82%E4%BB%A3_(%E4%B8%AD%E5%B3%B6%E3%81%BF%E3%82%86%E3%81%8D%E3%81%AE%E6%9B%B2)"]]}, "songs": [{"title": "糸", "album": "EAST ASIA", "year": 1992, "netease_id": 22773558, "cover": "daily_artist/ne_150873716.jpg", "starter": true, "why": "1992 年专辑《EAST ASIA》里的一首，当年只是单曲 B 面，二十多年后却越唱越红：2017 年拿下 JASRAC 金奖（版税分配全年第一），后来干脆升格成双 A 面。编曲瀬尾一三说想把她写成「天女」，所以前奏放了竖琴和雅乐味的声音。网易云这版收在精选《Singles 2000》。", "artist": "中島みゆき Miyuki Nakajima", "netease": "https://music.163.com/song?id=22773558", "file_flac": "/115/音乐库/每日歌手/20261029_中島みゆき/中島みゆき - 糸.flac", "file_mp3": "", "dest": "/115/音乐库/每日歌手/20261029_中島みゆき/", "youtube": "https://www.youtube.com/watch?v=hDisMIGEP1U"}, {"title": "地上の星", "album": "短篇集", "year": 2000, "netease_id": 22773548, "cover": "daily_artist/ne_2092275.jpg", "starter": true, "why": "NHK 纪录片《Project X》的主题曲。刚发行只排到第 15 名，2002 年她第一次上红白歌会、从冰冷的黑部水电站地下通道直播唱了这首（紧张到唱错了第二段歌词），转年 1 月，发行 130 周后冲上第一，在 Oricon 前 100 名里连待了 174 周。", "artist": "中島みゆき Miyuki Nakajima", "netease": "https://music.163.com/song?id=22773548", "file_flac": "/115/音乐库/每日歌手/20261029_中島みゆき/中島みゆき - 地上の星.flac", "file_mp3": "", "dest": "/115/音乐库/每日歌手/20261029_中島みゆき/", "youtube": "https://www.youtube.com/watch?v=v2SlpjCz7uE"}, {"title": "悪女", "album": "Singles", "year": 1981, "netease_id": 28784011, "cover": "daily_artist/ne_2092295.jpg", "starter": true, "why": "1981 年的单曲，她第二首 Oricon 冠军，卖了 80 多万张。歌里的女人发现男友变心，就故意让自己被讨厌。1993 年王菲用粤语翻唱成《若你真爱我》，这一版是 2024 年的新母带。", "artist": "中島みゆき Miyuki Nakajima", "netease": "https://music.163.com/song?id=28784011", "file_flac": "/115/音乐库/每日歌手/20261029_中島みゆき/中島みゆき - 悪女.flac", "file_mp3": "", "dest": "/115/音乐库/每日歌手/20261029_中島みゆき/"}, {"title": "時代", "album": "Singles", "year": 1975, "netease_id": 28784019, "cover": "daily_artist/ne_2092295.jpg", "starter": false, "why": "她的成名曲：1975 年凭它拿下雅马哈「ポプコン」大赛和世界歌谣祭的大奖。1993 年她又自己重录了一版，请 David Campbell 写了弦乐。", "artist": "中島みゆき Miyuki Nakajima", "netease": "https://music.163.com/song?id=28784019", "file_flac": "/115/音乐库/每日歌手/20261029_中島みゆき/中島みゆき - 時代.flac", "file_mp3": "", "dest": "/115/音乐库/每日歌手/20261029_中島みゆき/", "youtube": "https://www.youtube.com/watch?v=Ry_bpaKDcAo"}, {"title": "わかれうた", "album": "Singles", "year": 1977, "netease_id": 28784008, "cover": "daily_artist/ne_2092295.jpg", "starter": false, "why": "1977 年她作为歌手的第一首 Oricon 冠军，卖出 70 多万张。TBS 的排行节目《ザ・ベストテン》第一集就排到第 4，可她一次也没去上过这档节目。", "artist": "中島みゆき Miyuki Nakajima", "netease": "https://music.163.com/song?id=28784008", "file_flac": "/115/音乐库/每日歌手/20261029_中島みゆき/中島みゆき - わかれうた.flac", "file_mp3": "", "dest": "/115/音乐库/每日歌手/20261029_中島みゆき/"}], "songs_note": "5 首都已下到你的网盘，点金色按钮就能直接放。", "albums": [{"title": "寒水魚", "year": 1982, "cover": "daily_artist/ne_2092302.jpg", "desc": "1982 年 Oricon 年度专辑第一，她人气最顶的时候。收了一版和单曲完全不同的爵士味《悪女》。"}, {"title": "EAST ASIA", "year": 1992, "cover": "daily_artist/ne_150873716.jpg", "desc": "《糸》最早就出在这张。这首当年的 B 面歌，二十多年后在 2010 年代翻红，2017 年拿下 JASRAC 金奖。"}, {"title": "短篇集", "year": 2000, "cover": "daily_artist/ne_59658.jpg", "desc": "第一首是《地上の星》，最后一首是《ヘッドライト・テールライト》——正好是《Project X》的片头和片尾曲。"}], "awards": [["1975", "《時代》获雅马哈「ポプコン」大赛和世界歌谣祭大奖"], ["1977", "《わかれうた》成为她第一首 Oricon 单曲冠军"], ["1982", "《寒水魚》获 Oricon 年度专辑第一"], ["1983", "为柏原芳恵写的《春なのに》获日本唱片大奖作曲奖"], ["2003", "《地上の星》发行 130 周后登顶 Oricon，创下发行后最久才拿第一的纪录；她成为 70 至 2000 年代四个年代连续有冠军单曲的歌手"], ["2009", "获紫绶褒章"], ["2017", "《糸》获 JASRAC 金奖（版税分配全年第一）"]], "influences": {"from": [{"name": "吉田拓郎", "desc": "出道前她是吉田拓郎的「追星族」，常出入他的后台；拓郎后来也常在演唱会上唱她的《ファイト!》"}, {"name": "川上源一", "desc": "雅马哈的掌门人，把她从比赛里发掘出来；她每张专辑都把他写成「DAD」"}, {"name": "瀬尾一三", "desc": "1988 年起她所有原创专辑的编曲兼制作人，也是「夜会」的音乐总监"}], "to": [{"name": "王菲 Faye Wong", "tag": "已介绍过", "desc": "《容易受伤的女人》翻唱自她写的《ルージュ》，《若你真爱我》翻唱自《悪女》"}, {"name": "松任谷由実", "tag": "已介绍过", "desc": "同代的对手和朋友：媒体把她们比作「月亮与太阳」，一个是「恋爱歌女王」，一个是「失恋歌女王」"}, {"name": "柏原芳恵、研ナオコ、工藤静香", "desc": "她替很多歌手写过冠军歌：给研ナオコ写《かもめはかもめ》，给柏原芳恵写《春なのに》，给工藤静香写《MUGO・ん…色っぽい》的词"}]}, "live": [{"title": "地上の星 [公式]", "yt": "v2SlpjCz7uE", "url": "https://www.youtube.com/watch?v=v2SlpjCz7uE", "thumb": "daily_artist/yt_v2SlpjCz7uE.jpg", "src": "中島みゆき公式チャンネル", "desc": "她的官方频道放出的《地上の星》。"}, {"title": "時代（ライヴ 2010～11，东京国际论坛 A 厅）", "yt": "Ry_bpaKDcAo", "url": "https://www.youtube.com/watch?v=Ry_bpaKDcAo", "thumb": "daily_artist/yt_Ry_bpaKDcAo.jpg", "src": "中島みゆき公式チャンネル", "desc": "2010–11 年巡演「中島みゆき TOUR2010」的现场，唱的是让她出道的那首歌。"}, {"title": "糸（2020「结果オーライ」最后的巡演·精华）", "yt": "hDisMIGEP1U", "url": "https://www.youtube.com/watch?v=hDisMIGEP1U", "thumb": "daily_artist/yt_hDisMIGEP1U.jpg", "src": "中島みゆき公式チャンネル", "desc": "2020 年她称为「最后的巡演」的「结果オーライ」现场精华，出自蓝光初回特典。"}], "live_note": {"text": "她很少上电视，现场大多只在官方频道", "link": ["中島みゆき公式チャンネル", "https://www.youtube.com/watch?v=v2SlpjCz7uE"]}, "trivia": ["她的演唱会原则上只在两三千人规模的剧场开，不进大体育馆；两国国技馆、横滨体育馆去过，日本武道馆却一次也没演过。", "她在自己的深夜电台节目里，拿自己唱歌时细碎的颤音开玩笑，叫它「ちりめんビブラート」（绉纱颤音）。", "2002 年红白歌会在零下的黑部水电站地下通道直播，她紧张到唱错了《地上の星》第二段的歌词，可这首歌转年就登上了第一。", "她每张专辑的制作名单里都写着「DAD 川上源一」，感谢当年发掘她的雅马哈掌门人。", "1999 年她当过文部省国语审议会委员，是这个讨论日语规范的委员会里唯一的创作歌手。", "《わかれうた》冲到第一时，她一次也没去上热门排行节目《ザ・ベストテン》。"]}, {"date": "2026-10-28", "name": "王菲 Faye Wong", "name_native": "王菲", "name_zh": "王菲", "name_en": "Faye Wong", "badge": "跨时代经典", "kind": "classic", "region": "华语", "meta": "中国香港 · 歌手 / 词曲作者 / 演员 · 1969 年生于北京 · 1989 年以「王靖雯」之名出道", "why": "10 月 22 日的每日歌手邓丽君，在「影响与传承」里第一个连到的就是她：王菲中学时偷偷录的 6 盒翻唱磁带，大多是邓丽君的歌，1995 年又出了一整张致敬专辑。她还是今天日推那股另类摇滚口味在华语圈的老前辈——她最喜欢的乐队之一是苏格兰后朋克出身的 Cocteau Twins，还和对方隔空合作过。", "photo": "daily_artist/20261028_fayewong_apple.jpg", "photo_credit": "照片：Apple Music", "stats": [["970 万张", "2000 年吉尼斯认证：最畅销的粤语流行女歌手"], ["18 场", "90 年代中期在香港连开的演唱会场次，创下当时纪录"], ["50 万张", "《Eyes on Me》全球销量，当时最畅销的游戏音乐唱片"]], "in_library": [], "story": {"paragraphs": ["1969 年，王菲生在北京，妈妈是煤矿文工团的女高音，却坚决反对女儿走唱歌这条路。中学时她偷偷出过 6 盒翻唱磁带，大多是偶像**邓丽君**的歌，学校还得帮她瞒着妈妈。1987 年她考上了厦门大学生物系，却去了香港和爸爸团聚，本来只打算待一年拿居留、再去澳大利亚读书。她一句粤语都不会，孤独得很，就去学唱歌解闷，结果被唱片公司签下。1989 年她以「王靖雯」的名字出道——这是公司请算命先生起的，嫌「王菲」听着太「内地」；前三张唱片卖得一般，不少香港人觉得她「土」、没个性。", "转折在纽约。1991 年底她被送去美国进修，在纽约逛博物馆、坐咖啡馆，看到满街自信、不在乎别人眼光的人。她后来说：「我原本也是那样，独立、有点叛逆，可在香港我把自己弄丢了，变得像一台机器、一个衣架。」回来后她改回本名王菲，1992 年专辑《Coming Home》里那首《容易受伤的女人》借 TVB 剧《大时代》大红。1994 年，粤语翻唱的《梦中人》进了王家卫的电影《重庆森林》，她本人演女主角，后来凭这部戏拿下斯德哥尔摩电影节最佳女演员。", "她把苏格兰乐队 **Cocteau Twins** 列为最喜欢的乐队之一，1994 年的《胡思乱想》就听得出他们的影子；1996 年的《浮躁》大多是她自己作曲，Cocteau Twins 还专门为她写了两首。同一时期她和北京摇滚乐手**窦唯**相恋，常往北京跑，那股另类气质让她和香港主流流行乐拉开了距离。1995 年，她出了整张翻唱邓丽君的《菲靡靡之音》——邓丽君的歌在她成长的年代被叫作「靡靡之音」，在内地是禁的。", "1999 年她给日本游戏《最终幻想 VIII》唱英文主题曲《Eyes on Me》，同年成为第一位在日本武道馆开唱的华人歌手。2005 年再婚后她几乎淡出，连北京奥运开幕式的邀请也推掉了；2010 年在央视春晚唱了一首《传奇》复出。2016 年底，她在上海开了只此一场的「幻乐一场」，网上有 2000 万人看免费直播，女儿窦靖童也在和声队里。"], "sources": [["Wikipedia: Faye Wong", "https://en.wikipedia.org/wiki/Faye_Wong"], ["维基百科：王菲", "https://zh.wikipedia.org/wiki/%E7%8E%8B%E8%8F%B2"], ["维基百科：菲靡靡之音", "https://zh.wikipedia.org/wiki/%E8%8F%B2%E9%9D%A1%E9%9D%A1%E4%B9%8B%E9%9F%B3"]]}, "songs": [{"title": "梦中人", "album": "胡思乱想", "year": 1994, "netease_id": 300407, "cover": "daily_artist/ne_29771.jpg", "starter": true, "why": "翻唱爱尔兰乐队 The Cranberries 的《Dreams》，用粤语重新填了词。王家卫把它放进电影《重庆森林》，她本人就是片中女主角，这首也一直流传到今天：2024 年日本演员满岛光在台湾高雄的大港开唱上翻唱过它，2025 年美剧《Hacks》第四季结局也用了这首。", "artist": "王菲 Faye Wong", "netease": "https://music.163.com/song?id=300407", "file_flac": "/115/音乐库/每日歌手/20261028_王菲/王菲 - 梦中人.flac", "file_mp3": "", "dest": "/115/音乐库/每日歌手/20261028_王菲/", "youtube": "https://www.youtube.com/watch?v=hN2jOHeI5tc"}, {"title": "容易受伤的女人", "album": "Coming Home", "year": 1992, "netease_id": 1405841962, "cover": "daily_artist/ne_83653245.jpg", "starter": true, "why": "她的第一首大热歌。原曲是中岛美雪写、ちあきなおみ唱的日本歌《ルージュ》，被 TVB 剧《大时代》用作插曲后走红。她原本打算回美国继续读书，就因为这首歌留在了香港。借她这一版，这首歌后来在泰国、越南、东南亚乃至土耳其都翻红了。", "artist": "王菲 Faye Wong", "netease": "https://music.163.com/song?id=1405841962", "file_flac": "/115/音乐库/每日歌手/20261028_王菲/王菲 - 容易受伤的女人.flac", "file_mp3": "", "dest": "/115/音乐库/每日歌手/20261028_王菲/", "youtube": "https://www.youtube.com/watch?v=tDw_ULjZWA8"}, {"title": "红豆", "album": "唱游", "year": 1998, "netease_id": 299936, "cover": "daily_artist/ne_29725.jpg", "starter": true, "why": "1998 年专辑《唱游》里最受欢迎的抒情歌之一，后来被很多越南歌手翻成越南语唱。《唱游》是 1999 年新加坡最畅销的华语专辑，在日本发行头三个月也卖了近 9 万张。", "artist": "王菲 Faye Wong", "netease": "https://music.163.com/song?id=299936", "file_flac": "/115/音乐库/每日歌手/20261028_王菲/王菲 - 红豆.flac", "file_mp3": "", "dest": "/115/音乐库/每日歌手/20261028_王菲/", "youtube": "https://www.youtube.com/watch?v=5wmfXve11rM"}, {"title": "但愿人长久", "album": "菲靡靡之音", "year": 1995, "netease_id": 300216, "cover": "daily_artist/ne_29753.jpg", "starter": false, "why": "出自整张翻唱邓丽君的《菲靡靡之音》，原唱就是 10 月 22 日的每日歌手邓丽君。专辑本来计划和偶像合唱一首，可邓丽君在录音前去世了。2007 年中国第一颗探月卫星嫦娥一号在太空里播放的，就是王菲唱的这一版。", "artist": "王菲 Faye Wong", "netease": "https://music.163.com/song?id=300216", "file_flac": "/115/音乐库/每日歌手/20261028_王菲/王菲 - 但愿人长久.flac", "file_mp3": "", "dest": "/115/音乐库/每日歌手/20261028_王菲/", "youtube": "https://www.youtube.com/watch?v=ALOqOJ-kj08"}, {"title": "浮躁", "album": "浮躁", "year": 1996, "netease_id": 300148, "cover": "daily_artist/ne_29748.jpg", "starter": false, "why": "很多人眼里她最大胆、最完整的一张专辑的同名曲。整张大多是她自己作曲，听感受苏格兰乐队 Cocteau Twins 影响，对方还专门为这张写了《分裂》《扫兴》两首。当年不少歌迷嫌它太另类，它却成了邪典级的经典，也是她自己最喜欢的一张。", "artist": "王菲 Faye Wong", "netease": "https://music.163.com/song?id=300148", "file_flac": "/115/音乐库/每日歌手/20261028_王菲/王菲 - 浮躁.flac", "file_mp3": "", "dest": "/115/音乐库/每日歌手/20261028_王菲/", "youtube": "https://www.youtube.com/watch?v=13x_yYvGGqM"}], "songs_note": "5 首都已下到你的网盘，点金色按钮就能直接放。", "albums": [{"title": "胡思乱想", "year": 1994, "cover": "daily_artist/ne_29771.jpg", "desc": "Cocteau Twins 的影响第一次清清楚楚地出现在她的唱片里。《梦中人》在这张；还有她和当时的男友窦唯合写的《誓言》。"}, {"title": "浮躁", "year": 1996, "cover": "daily_artist/ne_29748.jpg", "desc": "她在新艺宝唱片的最后一张，也是她自己最喜欢的一张：大多是她自己作曲，Cocteau Twins 为她写了《分裂》《扫兴》。电台能放的情歌很少，当年不少歌迷看不懂，后来成了邪典级的经典。"}, {"title": "唱游", "year": 1998, "cover": "daily_artist/ne_29725.jpg", "desc": "四首是她自己作曲，其中《童》写给女儿、由窦唯制作；《红豆》《半途而废》是最受欢迎的两首。1999 年新加坡最畅销的华语专辑。"}], "awards": [["1992", "《容易受伤的女人》随 TVB 剧《大时代》走红，成为她的第一首大热歌"], ["1995", "凭《棋子》MV 拿下 MTV 国际观众选择奖（窦唯的《黑梦》是第二名）"], ["1996", "凭《重庆森林》获斯德哥尔摩国际电影节最佳女演员；登上《时代》杂志封面，是第一位上封面的华人歌手"], ["1999", "成为第一位在日本武道馆开唱的华人歌手"], ["2000", "《Eyes on Me》获日本金唱片大奖「年度歌曲（西洋音乐）」；吉尼斯世界纪录认证为最畅销的粤语流行女歌手"], ["2004", "台湾金曲奖最佳国语女演唱人"], ["2009", "国务院新闻办网站「新中国 60 年最具影响力文化人物」网络票选第二名，仅次于邓丽君"]], "influences": {"from": [{"name": "邓丽君 Teresa Teng", "tag": "已介绍过", "desc": "她的偶像。少女时代的 6 盒翻唱磁带大多是邓丽君的歌，1995 年出了致敬专辑《菲靡靡之音》，2013 年还在邓丽君 60 岁冥诞纪念演唱会上唱了四首"}, {"name": "Cocteau Twins", "desc": "她最爱的乐队之一；她翻唱过他们的歌，他们为《浮躁》写了两首，她也在他们 1996 年专辑亚洲版里合唱了一首"}, {"name": "中岛美雪", "desc": "《容易受伤的女人》和后来的《人间》原曲都出自中岛美雪"}, {"name": "The Cranberries", "desc": "《梦中人》翻唱自他们的《Dreams》"}, {"name": "窦唯", "desc": "北京摇滚乐手，她的前夫；她常跑北京摇滚圈，那股气质让她和香港主流拉开了距离"}], "to": [{"name": "岩井俊二《关于莉莉周的一切》", "desc": "导演说片中歌姬莉莉周这个角色，是他看完一场王菲演唱会后构想出来的"}, {"name": "满岛光", "desc": "日本歌手、演员，说王菲是她的偶像和缪斯，2024 年在高雄翻唱过《梦中人》"}, {"name": "my little airport / 江美琪", "desc": "香港独立乐队 my little airport 写过《王菲，关于你的眉》；江美琪的出道专辑就叫《我爱王菲》"}, {"name": "Lene Marlin", "desc": "挪威歌手，她的《Still Here》是《我愿意》的英文翻唱"}]}, "live": [{"title": "相约一九九八（1998 央视春晚，和那英合唱）", "yt": "ZfGmm4vWoxc", "url": "https://www.youtube.com/watch?v=ZfGmm4vWoxc", "thumb": "daily_artist/yt_ZfGmm4vWoxc.jpg", "src": "CCTV春晚 官方 YouTube", "desc": "一个是内地天后、一个是香港天后，这首当年成了内地播得最多的歌；也正是这次露面之后，她 1998 年底第一次在内地开了巡回演唱会。"}, {"title": "传奇（2010 央视春晚 · 复出首秀）", "yt": "x1b5aaXIcw0", "url": "https://www.youtube.com/watch?v=x1b5aaXIcw0", "thumb": "daily_artist/yt_x1b5aaXIcw0.jpg", "src": "CCTV春晚 官方 YouTube", "desc": "淡出近五年后第一次正式登台，翻唱李健的《传奇》；之后她开始了 2010–2012 年的复出巡演。"}, {"title": "梦中人（2018 湖南卫视《幻乐之城》）", "yt": "YIPRmxD2XXo", "url": "https://www.youtube.com/watch?v=YIPRmxD2XXo", "thumb": "daily_artist/yt_YIPRmxD2XXo.jpg", "src": "芒果TV音乐 官方 YouTube", "desc": "2018 年她参加《幻乐之城》，在节目里重新唱起二十多年前《重庆森林》里的这首。"}], "live_note": {"text": "官方频道还有历年 MV", "link": ["Faye Wong Official Channel", "https://www.youtube.com/@fayewongofficialchannel560"]}, "trivia": ["出道时用的「王靖雯」和英文名 Shirley，是唱片公司请算命先生起的；1992 年她改回王菲，新的英文名 Faye 就取「菲」的谐音。", "演唱会上她很少跳舞、很少说话，也从不返场，常常坐着升降台沉到舞台下面退场。她说当年穿超长袖子，是因为「没有编舞，不知道手该往哪儿放」。", "《我愿意》的词作者姚谦说，他是在飞机上翻到小报，看到她为了陪窦唯、清早在北京胡同里端着尿盆去公厕，才写下了「我愿意为你，忘记我姓名」。", "1999 年记者追问她离婚的事，她回了一句「关你什么事」；后来她女儿用的手机壳上，印的就是这句话的表情包。", "她不会一句粤语就去了香港，结果成了吉尼斯认证卖得最多的粤语流行女歌手；1997 年后她改为主要唱母语普通话。", "1996 年她登上《时代》杂志封面，是继巩俐之后第二位上封面的华人，也是第一位华人歌手。"]}, {"date": "2026-10-27", "name": "The Weeknd", "name_native": "The Weeknd", "name_zh": "威肯", "name_en": "The Weeknd", "badge": "现象级", "kind": "hot", "region": "欧美", "meta": "加拿大 · 歌手 / 词曲作者 / 制作人 · 1990 年生于安大略 · 本名 Abel Tesfaye · 2010 年匿名在 YouTube 出道", "why": "你 10 月 17 日收藏了杏里《Remember Summer Days》，对 80 年代日本城市流行一直很买账。今天的主角把这股味道带进了全球榜单：他 2022 年的《Out of Time》直接采样了亜蘭知子 1983 年的城市流行老歌《Midnight Pretenders》。今天日推最后一首 Parcels 合作过的 Daft Punk，也和他一起做了《Starboy》。", "photo": "daily_artist/20261027_theweeknd_apple.jpg", "photo_credit": "照片：Apple Music", "stats": [["8 首", "美国唱片业协会钻石认证单曲"], ["1.114 亿", "Spotify 月听众（2023 年吉尼斯纪录）"], ["第 1 名", "《Blinding Lights》：Billboard Hot 100 史上成绩最好的歌"]], "in_library": [], "story": {"paragraphs": ["1990 年，Abel Tesfaye 出生在加拿大安大略，父母是埃塞俄比亚移民，他出生后不久两人就分开了。他在多伦多郊区士嘉堡由妈妈和外婆带大，第一语言是埃塞俄比亚的阿姆哈拉语，又因为上的是法语沉浸学校，法语也很流利。17 岁他退了学，和好友 La Mar Taylor（后来成了他的创意总监）搬到 Parkdale 区合租，靠在 American Apparel 服装店叠衣服过日子。艺名的来历很随意：搬家那天正好是周末（weekend），去掉最后一个 e，是为了避开一支同名的加拿大乐队。", "2010 年 12 月，一个叫「xoxxxoooxo」的账号在 YouTube 上传了三首歌，没人知道是谁唱的。歌在网上慢慢传开，**Drake** 在博客里推荐，Pitchfork 和《纽约时报》也跟着报道。他后来说，藏起身份是因为觉得自己长得不像人们印象里的 R&B 歌手，想让大家先只听音乐。2011 年他一口气发了三张免费混音带，第一张《House of Balloons》入围加拿大 Polaris 音乐奖短名单；音乐记者认为这张混音带重新塑造了后来的 R&B 和流行乐。", "2015 年，瑞典制作人 **Max Martin** 操刀的《Can't Feel My Face》把他从小众歌手变成了流行巨星，专辑《Beauty Behind the Madness》拿下格莱美；第二年他请来 **Daft Punk** 做《Starboy》，他说过 Daft Punk「是我做音乐的原因之一」。他从小爱玩游戏，说是《侠盗猎车手：罪恶都市》里的电台让他迷上了 80 年代的 Hall & Oates 和 Michael Jackson。", "2019 年底的《Blinding Lights》把这份 80 年代情结推到了顶点：它成了 Billboard Hot 100 史上成绩最好的歌。2021 年 2 月，他成为第一位独挑超级碗中场秀的加拿大独唱歌手，还自己掏了 700 万美元。同年他因为《After Hours》格莱美零提名而宣布抵制格莱美，直到 2025 年才重新登上格莱美舞台。2022 年的专辑《Dawn FM》里，他把一首 1983 年的日本城市流行采样进了《Out of Time》。"], "sources": [["Wikipedia: The Weeknd", "https://en.wikipedia.org/wiki/The_Weeknd"], ["Wikipedia: List of awards and nominations received by the Weeknd", "https://en.wikipedia.org/wiki/List_of_awards_and_nominations_received_by_the_Weeknd"], ["Wikipedia: Blinding Lights", "https://en.wikipedia.org/wiki/Blinding_Lights"], ["Wikipedia: Out of Time (The Weeknd song)", "https://en.wikipedia.org/wiki/Out_of_Time_(The_Weeknd_song)"], ["Wikipedia: Starboy (song)", "https://en.wikipedia.org/wiki/Starboy_(song)"], ["Wikipedia: Save Your Tears", "https://en.wikipedia.org/wiki/Save_Your_Tears"], ["Wikipedia: Can't Feel My Face", "https://en.wikipedia.org/wiki/Can%27t_Feel_My_Face"], ["Wikipedia: Super Bowl LV halftime show", "https://en.wikipedia.org/wiki/Super_Bowl_LV_halftime_show"], ["Wikipedia: After Hours (The Weeknd album)", "https://en.wikipedia.org/wiki/After_Hours_(The_Weeknd_album)"], ["Wikipedia: Beauty Behind the Madness", "https://en.wikipedia.org/wiki/Beauty_Behind_the_Madness"], ["Wikipedia: Starboy (album)", "https://en.wikipedia.org/wiki/Starboy_(album)"], ["Wikipedia: Dawn FM", "https://en.wikipedia.org/wiki/Dawn_FM"], ["Wikipedia: Tomoko Aran", "https://en.wikipedia.org/wiki/Tomoko_Aran"]]}, "songs": [{"title": "Blinding Lights", "album": "After Hours", "year": 2020, "netease_id": 1432460359, "cover": "daily_artist/ne_86675713.jpg", "starter": true, "why": "合成器一响就是 80 年代：评论说开头的鼓点像 Michael Jackson《Beat It》，合成器旋律像 a-ha。瑞典金牌制作人 Max Martin 合写合制。它是 Billboard 史上第一首在前十名待满一整年的歌，2021 年被 Billboard 评为 Hot 100 史上成绩最好的歌；2023 年初成为 Spotify 播放次数最多的歌。", "artist": "The Weeknd", "netease": "https://music.163.com/song?id=1432460359", "file_flac": "/115/音乐库/每日歌手/20261027_The Weeknd/The Weeknd - Blinding Lights.flac", "file_mp3": "", "dest": "/115/音乐库/每日歌手/20261027_The Weeknd/", "youtube": "https://www.youtube.com/watch?v=4NRXx6U8ABQ"}, {"title": "Out of Time", "album": "Dawn FM", "year": 2022, "netease_id": 1909926104, "cover": "daily_artist/ne_138513905.jpg", "starter": true, "why": "今天最该先听的一首：它采样了日本歌手亜蘭知子 1983 年的城市流行老歌《Midnight Pretenders》，所以亜蘭知子和織田哲郎也挂了作曲名。评论把它归为 R&B 加城市流行。MV 里他和韩国演员郑浩妍在空荡荡的酒店卡拉 OK 包厢里唱这首，拿了 2022 年 MTV 音乐录影带奖最佳 R&B 视频。", "artist": "The Weeknd", "netease": "https://music.163.com/song?id=1909926104", "file_flac": "/115/音乐库/每日歌手/20261027_The Weeknd/The Weeknd - Out of Time.flac", "file_mp3": "", "dest": "/115/音乐库/每日歌手/20261027_The Weeknd/", "youtube": "https://www.youtube.com/watch?v=2fDzCWNS3ig"}, {"title": "Starboy", "album": "Starboy", "year": 2016, "netease_id": 431610014, "cover": "daily_artist/ne_34881446.jpg", "starter": true, "why": "和法国电子二人组 Daft Punk 合写合制，是 Daft Punk 唯一一首登上 Billboard Hot 100 冠军的歌。发这张专辑时他剪掉了招牌的冲天脏辫；MV 里新的他把旧的自己「干掉」，还毁掉了上一张专辑拿的奖杯。", "artist": "The Weeknd", "netease": "https://music.163.com/song?id=431610014", "file_flac": "/115/音乐库/每日歌手/20261027_The Weeknd/The Weeknd - Starboy.flac", "file_mp3": "", "dest": "/115/音乐库/每日歌手/20261027_The Weeknd/", "youtube": "https://www.youtube.com/watch?v=34Na4j8AVgA"}, {"title": "Save Your Tears", "album": "After Hours", "year": 2020, "netease_id": 1432456852, "cover": fy 月听众最多的艺人（1.114 亿），也是第一个突破 1 亿的人"]], "influences": {"from": [{"name": "Michael Jackson", "desc": "他说是 Michael Jackson 让他想当歌手；评论常拿他的假声和《Can't Feel My Face》跟 MJ 比"}, {"name": "Prince", "desc": "和 Michael Jackson 一起被他列为最主要的音乐启蒙"}, {"name": "Aster Aweke", "desc": "埃塞俄比亚歌手；他那种往高处飞的唱法受她和家乡音乐影响"}, {"name": "Daft Punk", "desc": "「他们是我做音乐的原因之一」；后来一起做了《Starboy》《I Feel It Coming》。今天日推里 Parcels 的单曲《Overnight》也是 Daft Punk 制作的"}, {"name": "亜蘭知子 Tomoko Aran", "desc": "1983 年的城市流行《Midnight Pretenders》被他采样进《Out of Time》"}], "to": [{"name": "Bryson Tiller / 6lack", "desc": "加拿大音乐杂志 Exclaim! 认为他们都受《House of Balloons》影响"}, {"name": "Dua Lipa / Miley Cyrus", "desc": "西班牙 LOS40 认为《After Hours》带起了一波 80 年代流行复古热，她们随后也走了这条路"}]}, "live": [{"title": "超级碗 LV 中场秀（全场 · 2021）", "yt": "9rhadTURsrw", "url": "https://www.youtube.com/watch?v=9rhadTURsrw", "thumb": "daily_artist/yt_9rhadTURsrw.jpg", "src": "NFL 官方 YouTube", "desc": "2021 年 2 月 7 日坦帕，没有请任何嘉宾，一个人唱满全场；唱《Can't Feel My Face》时他钻进舞台后搭的迷宫，伴舞个个满脸绷带。"}, {"title": "Blinding Lights（2020 MTV 音乐录影带奖开场）", "yt": "ewfdRy5jfF8", "url": "https://www.youtube.com/watch?v=ewfdRy5jfF8", "thumb": "daily_artist/yt_ewfdRy5jfF8.jpg", "src": "The Weeknd 官方 YouTube", "desc": "在纽约哈德逊园区一栋大楼的观景台楼顶唱，背后放着烟花，给当年的颁奖礼开场。"}, {"title": "Starboy（2016 全美音乐奖）", "yt": "hQPJfIXTp0k", "url": "https://www.youtube.com/watch?v=hQPJfIXTp0k", "thumb": "daily_artist/yt_hQPJfIXTp0k.jpg", "src": "The Weeknd 官方 YouTube", "desc": "《Starboy》发行两个月后的颁奖礼现场，这时他已经换成了《Starboy》时期的短发新造型。"}], "live_note": {"text": "官方频道还有历年 MV 和现场", "link": ["The Weeknd Official YouTube", "https://www.youtube.com/@TheWeeknd"]}, "trivia": ["艺名少一个 e：搬家那天正好是周末（weekend），去掉 e 是为了避开加拿大一支叫 the Weekend 的乐队的商标。", "他在 American Apparel 服装店叠衣服时，同事在店里放他早期的歌，却不知道唱歌的就是身边这个人。", "他说是小时候玩《侠盗猎车手：罪恶都市》，游戏里的电台让他第一次迷上 80 年代音乐。", "2013 年的首张专辑《Kiss Land》以日本为中心想象出一个世界；他说巡演去东京让他一下子接触到「一大堆新信息」。", "《Out of Time》MV 里很多镜头让《滚石》想起电影《迷失东京》——导演索菲亚·科波拉正是今天日推第二首 Phoenix 主唱的妻子。", "2014 年他捐了 5 万加元给多伦多大学，开设埃塞俄比亚古典语言 Ge'ez 的课；多伦多市还把 2021 年 2 月 7 日定为「The Weeknd 日」。"]}, {"date": "2026-10-26", "name": "松任谷由実 Yumi Matsutoya", "name_native": "松任谷由実", "name_zh": "松任谷由实", "name_en": "Yumi Matsutoya", "badge": "跨时代经典", "kind": "classic", "region": "日本", "meta": "日本 · 创作歌手 · 1954 年生于东京八王子 · 1972 年以「荒井由実」出道 · 外号 ユーミン（Yuming）", "why": "10 月 20 日的每日歌手是山下達郎，昨天的日推里有大貫妙子的《都会》，你也给她的《4:00A.M.》打过「还不错」。1975 年，这两个人一起站在麦克风前，给一位 21 岁的女生唱和声，那首歌就是《ルージュの伝言》。今天的主角就是这位女生：日本卖唱片最多的创作歌手之一，宫崎骏两次借她的歌给电影收尾。", "photo": "daily_artist/20261026_yuming_apple.jpg", "photo_credit": "照片：Apple Music", "stats": [["4,000 万张+", "唱片总销量（Oricon）"], ["6 个年代", "专辑都拿过 Oricon 第一（吉尼斯纪录）"], ["25 张", "Oricon 冠军专辑，个人歌手第一"]], "in_library": [], "story": {"paragraphs": ["1954 年，荒井由実生在东京八王子一家开了几十年的和服店里，6 岁学钢琴，11 岁学三味线，14 岁学贝斯。上初中起，她就常去麻布台一家叫「キャンティ」的意大利餐厅——那里是当年文化人的聚会处，后来创办 Alfa 唱片的人，正是那里的常客。13 岁那年，她在收音机里听到 Procol Harum 的《A Whiter Shade of Pale》，大受震撼：「原来钢琴也能玩摇滚，我说不定也行。」17 岁，她写的歌被前 The Tigers 吉他手加橋かつみ录成单曲，她先当上了作曲家。", "1972 年她刚进多摩美术大学，Alfa 的创办人村井邦彦劝她自己唱。7 月的出道单曲《返事はいらない》只卖了 300 张；第二年和キャラメル・ママ（細野晴臣、鈴木茂、林立夫，还有后来成了她丈夫的键盘手**松任谷正隆**）录的首张专辑《ひこうき雲》，也只卖了 3000 张。那一年半，几乎只有 TBS 电台深夜节目主持人林美雄在力挺她；她的第一场演唱会票卖不出一半，是林美雄在电台上号召听众去捧场，才坐满。", "转机在 1975 年。她写给 Hi-Fi Set 的《卒業写真》、给 BanBan 的《「いちご白書」をもう一度》接连走红；第三张专辑《COBALT HOUR》请来**山下達郎、大貫妙子、吉田美奈子**唱和声，单曲《あの日にかえりたい》拿到 Oricon 第一。1976 年的年度专辑榜前十里，她一个人占了三张。同年 11 月她嫁给松任谷正隆，改名「松任谷由実」，当时一度想退出乐坛、只写歌。", "结婚后的几年唱片卖得平平，直到 1981 年《守ってあげたい》再次走红。从那年的《昨晩お会いしましょう》起，她连续 17 张原创专辑登上 Oricon 第一；1990 年的《天国のドア》是日本第一张出货 200 万张的专辑，1993 年的《真夏の夜の夢》卖出 143 万张。1989 年《魔女宅急便》用了她两首歌，2013 年《起风了》又用了《ひこうき雲》。2022 年，她成为第一位获选「文化功劳者」的创作歌手。"], "sources": [["维基百科：松任谷由実", "https://ja.wikipedia.org/wiki/%E6%9D%BE%E4%BB%BB%E8%B0%B7%E7%94%B1%E5%AE%9F"], ["Wikipedia: Yumi Matsutoya", "https://en.wikipedia.org/wiki/Yumi_Matsutoya"], ["维基百科：ルージュの伝言", "https://ja.wikipedia.org/wiki/%E3%83%AB%E3%83%BC%E3%82%B8%E3%83%A5%E3%81%AE%E4%BC%9D%E8%A8%80"], ["维基百科：やさしさに包まれたなら", "https://ja.wikipedia.org/wiki/%E3%82%84%E3%81%95%E3%81%97%E3%81%95%E3%81%AB%E5%8C%85%E3%81%BE%E3%82%8C%E3%81%9F%E3%81%AA%E3%82%89"], ["维基百科：14番目の月", "https://ja.wikipedia.org/wiki/14%E7%95%AA%E7%9B%AE%E3%81%AE%E6%9C%88"], ["维基百科：ひこうき雲 (荒井由実の曲)", "https://ja.wikipedia.org/wiki/%E3%81%B2%E3%81%93%E3%81%86%E3%81%8D%E9%9B%B2_(%E8%8D%92%E4%BA%95%E7%94%B1%E5%AE%9F%E3%81%AE%E6%9B%B2)"], ["维基百科：ひこうき雲 (荒井由実のアルバム)", "https://ja.wikipedia.org/wiki/%E3%81%B2%E3%81%93%E3%81%86%E3%81%8D%E9%9B%B2_(%E8%8D%92%E4%BA%95%E7%94%B1%E5%AE%9F%E3%81%AE%E3%82%A2%E3%83%AB%E3%83%90%E3%83%A0)"], ["维基百科：真夏の夜の夢 (松任谷由実の曲)", "https://ja.wikipedia.org/wiki/%E7%9C%9F%E5%A4%8F%E3%81%AE%E5%A4%9C%E3%81%AE%E5%A4%A2_(%E6%9D%BE%E4%BB%BB%E8%B0%B7%E7%94%B1%E5%AE%9F%E3%81%AE%E6%9B%B2)"], ["维基百科：COBALT HOUR", "https://ja.wikipedia.org/wiki/COBALT_HOUR"], ["维基百科：MISSLIM", "https://ja.wikipedia.org/wiki/MISSLIM"]]}, "songs": [{"title": "やさしさに包まれたなら", "album": "MISSLIM", "year": 1974, "netease_id": 617267, "cover": "daily_artist/ne_58743.jpg", "starter": true, "why": "《魔女宅急便》的片尾曲。它最早是不二家「软心泡芙」的广告歌——歌名里的「被温柔包裹」，说的就是外面裹着焦糖奶油的泡芙。电影用的是专辑版：吉他扫弦加踏板电吉他，比单曲版快、更轻快。", "artist": "松任谷由実 Yumi Matsutoya", "netease": "https://music.163.com/song?id=617267", "file_flac": "/115/音乐库/每日歌手/20261026_松任谷由実/松任谷由実 - やさしさに包まれたなら.flac", "file_mp3": "", "dest": "/115/音乐库/每日歌手/20261026_松任谷由実/", "youtube": "https://www.youtube.com/watch?v=2gAGzN4rjHY"}, {"title": "ルージュの伝言", "album": "COBALT HOUR", "year": 1975, "netease_id": 22764449, "cover": "daily_artist/ne_2091085.jpg", "starter": true, "why": "《魔女宅急便》的片头曲。和声是山下達郎、大貫妙子、吉田美奈子、伊集加代子——编曲的松任谷正隆说，原本录得只有 60 分，是山下拉来这几个人做和声，才变成「漂亮的美式流行」。", "artist": "松任谷由実 Yumi Matsutoya", "netease": "https://music.163.com/song?id=22764449", "file_flac": "/115/音乐库/每日歌手/20261026_松任谷由実/松任谷由実 - ルージュの伝言.flac", "file_mp3": "", "dest": "/115/音乐库/每日歌手/20261026_松任谷由実/", "youtube": "https://www.youtube.com/watch?v=L9oHgG-ho_Q"}, {"title": "中央フリーウェイ", "album": "14番目の月", "year": 1976, "netease_id": 617096, "cover": "daily_artist/ne_58717.jpg", "starter": true, "why": "唱的是东京中央高速一路往八王子开，右边东京赛马场、左边三得利啤酒厂。据说写的是男友松任谷正隆下班开车送她回家的路；贝斯是美国名手 Leland Sklar。", "artist": "松任谷由実 Yumi Matsutoya", "netease": "https://music.163.com/song?id=617096", "file_flac": "/115/音乐库/每日歌手/20261026_松任谷由実/松任谷由実 - 中央フリーウェイ.flac", "file_mp3": "", "dest": "/115/音乐库/每日歌手/20261026_松任谷由実/", "youtube": "https://www.youtube.com/watch?v=6k-PDloqHVs"}, {"title": "ひこうき雲", "album": "ひこうき雲", "year": 1973, "netease_id": 1312356757, "cover": "daily_artist/ne_73576137.jpg", "starter": false, "why": "首张专辑的第一首，写的是小学一位患肌肉萎缩症、早早过世的同学。受 Procol Harum《A Whiter Shade of Pale》影响写成；2013 年被宫崎骏选作《起风了》主题曲。（网易云这版收在 2013 年为电影重新上架的《ひこうき雲》里，时长和原版一样是 3 分 26 秒。）", "artist": "松任谷由実 Yumi Matsutoya", "netease": "https://music.163.com/song?id=1312356757", "file_flac": "/115/音乐库/每日歌手/20261026_松任谷由実/松任谷由実 - ひこうき雲.flac", "file_mp3": "", "dest": "/115/音乐库/每日歌手/20261026_松任谷由実/", "youtube": "https://www.youtube.com/watch?v=24g3l_IJuIE"}, {"title": "真夏の夜の夢", "album": "真夏の夜の夢", "year": 1993, "netease_id": 615983, "cover": "daily_artist/ne_58567.jpg", "starter": false, "why": "她卖得最好的单曲：1993 年日剧《誰にも言えない》主题曲，连续两周 Oricon 第一，累计 143 万张。你同步过的桑田佳祐 也翻唱过，收进 2019 年发行的现场影像《第三回ひとり紅白歌合戦》。", "artist": "松任谷由実 Yumi Matsutoya", "netease": "https://music.163.com/song?id=615983", "file_flac": "/115/音乐库/每日歌手/20261026_松任谷由実/松任谷由実 - 真夏の夜の夢.flac", "file_mp3": "", "dest": "/115/音乐库/每日歌手/20261026_松任谷由実/", "youtube": "https://www.youtube.com/watch?v=fxTD_ZIAnH4"}], "songs_note": "5 首都已下到你的网盘，点金色按钮就能直接放。", "albums": [{"title": "ひこうき雲", "year": 1973, "cover": "daily_artist/ne_58755.jpg", "desc": "首张专辑，伴奏是キャラメル・ママ（細野晴臣、鈴木茂、林立夫、松任谷正隆）。当年只卖了 3000 张，现在是日本流行乐的起点之一。"}, {"title": "COBALT HOUR", "year": 1975, "cover": "daily_artist/ne_2091085.jpg", "desc": "让「荒井由実」这个名字真正被记住的一张：《卒業写真》《ルージュの伝言》都在这里，和声有山下達郎、大貫妙子、吉田美奈子。"}, {"title": "14番目の月", "year": 1976, "cover": "daily_artist/ne_58717.jpg", "desc": "以「荒井由実」名义的最后一张原创专辑；请来美国乐手 Leland Sklar、Mike Baird，《中央フリーウェイ》就在这张。"}], "awards": [["1976", "第 9 届日本唱片销售大奖；年度专辑榜前十独占三张"], ["1991", "第 5 届日本金唱片大奖 年度艺人"], ["2013", "紫绶褒章"], ["2018", "第 66 届菊池宽奖"], ["2022", "文化功劳者（创作歌手第一人）；日本唱片大奖 特别显彰"], ["2023", "吉尼斯世界纪录：连续 6 个年代拿下日本专辑榜第一"]], "influences": {"from": [{"name": "Procol Harum", "desc": "13 岁听到《A Whiter Shade of Pale》，才觉得「钢琴摇滚我也能做」；《ひこうき雲》就是受它影响写的"}, {"name": "Françoise Hardy", "desc": "《MISSLIM》里的《私のフランソワーズ》写的就是她"}, {"name": "Carole King / Joni Mitchell", "desc": "英文维基说她不少歌深受这些美国唱作人影响"}], "to": [{"name": "山下達郎", "desc": "从《MISSLIM》起给她做了约五年和声编曲；《ルージュの伝言》的和声就是他拉起来的", "tag": "你的歌单里有"}, {"name": "大貫妙子 / Taeko Onuki", "desc": "《COBALT HOUR》《14番目の月》的和声成员", "tag": "你的评分里有"}, {"name": "KIRINJI / キリンジ", "desc": "2002 年翻唱过《ひこうき雲》专辑里的《曇り空》", "tag": "你收藏的"}, {"name": "NUMBER GIRL（向井秀徳）", "desc": "向井秀徳和峯田和伸翻唱《守ってあげたい》，她说是「至今所有翻唱里最开心的一次」", "tag": "你的评分里有"}, {"name": "桑田佳祐", "desc": "翻唱《真夏の夜の夢》，收进 2019 年的现场影像《第三回ひとり紅白歌合戦》", "tag": "你的歌单里有"}, {"name": "YOASOBI", "desc": "2023 年以「YOASOBI cheers 松任谷由実」名义重做《中央フリーウェイ》，Ayase 加词并编曲"}]}, "live": [{"title": "ルージュの伝言（宇宙図書館 巡演 2016-2017）", "yt": "ZS6eNJPVvoE", "url": "https://www.youtube.com/watch?v=ZS6eNJPVvoE", "thumb": "daily_artist/yt_ZS6eNJPVvoE.jpg", "src": "松任谷由実官方 YouTube", "desc": "出道四十多年后的巡演，这首 1975 年的歌仍在曲目里。"}, {"title": "中央フリーウェイ（Yumi Arai The Concert with old Friends · 1996）", "yt": "43J3Hdljex4", "url": "https://www.youtube.com/watch?v=43J3Hdljex4", "thumb": "daily_artist/yt_43J3Hdljex4.jpg", "src": "松任谷由実官方 YouTube", "desc": "1996 年，婚后二十年的她重新用「荒井由実」的名字，召集当年的老乐手在中野 Sunplaza 连唱三天。"}, {"title": "やさしさに包まれたなら（THE LAST WEDNESDAY TOUR 2006）", "yt": "LfQ0MVIYFnM", "url": "https://www.youtube.com/watch?v=LfQ0MVIYFnM", "thumb": "daily_artist/yt_LfQ0MVIYFnM.jpg", "src": "松任谷由実官方 YouTube", "desc": "2006 年巡演现场，《魔女宅急便》片尾那首。"}], "live_note": {"text": "官方频道还有几十支历年 MV 和现场", "link": ["松任谷由実 Official YouTube", "https://www.youtube.com/@yuming_official"]}, "trivia": ["「ユーミン」这个外号，是她十三四岁时暗恋的华人贝斯手 Sy Chen（シー・ユー・チェン）先叫起来的。", "给别人写歌时她常用笔名「呉田軽穂」——谐音好莱坞影星葛丽泰·嘉宝（Greta Garbo）；松田聖子的《赤いスイートピー》就是用这个名字作的曲。", "她拿《MISSLIM》的版税买了一张劳特累克的石版画，学的是萨冈用第一笔版税买捷豹的故事。", "《中央フリーウェイ》据说写的是松任谷正隆开车送她回八王子的路，那辆车被形容成「うんこ色」（屎黄色）的丰田 Mark II。", "以前她一直不上红白歌会，理由是「要在家做年菜」，直到 2005 年才第一次出场。", "她给山下達郎起的外号是「親指」（大拇指）。"]}, {"date": "2026-10-25", "name": "草東沒有派對 No Party For Cao Dong", "name_native": "草東沒有派對", "name_zh": "草东没有派对", "name_en": "No Party For Cao Dong", "badge": "现象级", "kind": "hot", "region": "华语", "meta": "台湾 · 独立摇滚乐团 · 2012 年成军于台北 · 巫堵（主唱/吉他）、筑筑（吉他）等", "why": "你收藏了 5 首羊文学，也给 NUMBER GIRL《透明少女》、Turnstile 打过分——吉他一响就带劲的乐队你一直听得进去。今天轮到华语：一支用手工专辑、在咖啡馆卖 CD 起家，最后在金曲奖压过五月天拿下最佳乐团的台湾乐队。", "photo": "daily_artist/20261025_nopartyforcaodong_apple.jpg", "photo_credit": "照片：Apple Music", "stats": [["3 天", "《醜奴兒》首批 2000 张手工 CD 售罄"], ["不到 1 分钟", "2021 小巨蛋 11,000 张票卖光"], ["6 座", "金曲奖（2017、2024 各 3 座）"]], "in_library": [], "story": {"paragraphs": ["2012 年，高中同学巫堵（林耕佑）和筑筑（詹为筑）在台北阳明山的草东街重遇。巫堵在那条路上玩滑板，筑筑就跟在旁边跑步减肥，两个人一边聊摇滚一边组了乐队，先叫「草东街左转」，又改「草东街派对」。一开始玩的是受 Two Door Cinema Club 影响的电子摇滚；几次换人之后，2014 年改名**草東沒有派對**。贝斯手被征召当兵，乐队停了将近一年——也正是这一年，他们决定认真做音乐，声音从电子舞曲转向更像 Nirvana 的油渍摇滚。", "2015 年复出，自己做了 100 张手工 EP，演出时卖，很快抢空；乐迷把 EP 里的《大風吹》传上 YouTube，半年破九万五千次点击。拿着文化部三十万新台币的录音补助，他们和制作人李孝祖在他的「好意思录音室」录完首张专辑。专辑名借宋代辛弃疾的词牌《醜奴兒》，暗暗自嘲「少年不识愁滋味，为赋新词强说愁」。", "2016 年 2 月《醜奴兒》发行，首批 2000 张手工 CD 只在台湾 11 家咖啡馆和独立唱片行卖，三天卖光。那年金音奖拿了最佳乐团、最佳新人、最佳摇滚单曲；2017 年第 28 届金曲奖又拿下最佳乐团、最佳新人和年度歌曲《大風吹》，最佳乐团压过了五月天。评审主席黄韵玲说：「他们是闷世代的爆发。」随后乐团因兵役休团一年。", "2019 年他们去了 SXSW，也给赤烛游戏的《还愿》唱了同名主题曲。2021 年首场台北小巨蛋 11,000 张票不到一分钟卖完，却因疫情延期；同年 10 月，鼓手凡凡（蔡忆凡）在防疫旅馆离世，年仅 26 岁，演唱会最终取消。沉寂一年多后，2023 年 5 月第二张专辑《瓦合》发行，2024 年第 35 届金曲奖拿下年度专辑、最佳华语专辑、最佳乐团。"], "sources": [["维基百科：草東沒有派對", "https://zh.wikipedia.org/wiki/%E8%8D%89%E6%9D%B1%E6%B2%92%E6%9C%89%E6%B4%BE%E5%B0%8D"], ["维基百科：醜奴兒 (專輯)", "https://zh.wikipedia.org/wiki/%E9%86%9C%E5%A5%B4%E5%85%92_(%E5%B0%88%E8%BC%AF)"], ["Wikipedia: No Party for Cao Dong", "https://en.wikipedia.org/wiki/No_Party_for_Cao_Dong"]]}, "songs": [{"title": "大風吹", "album": "醜奴兒", "year": 2016, "netease_id": 411314657, "cover": "daily_artist/ne_34674226.jpg", "starter": true, "why": "2017 年金曲奖「年度歌曲」。2015 年还只在 100 张手工 EP 里时，乐迷传到 YouTube 的版本半年就破 9.5 万次点击。先从这首认识他们。", "artist": "草東沒有派對 No Party For Cao Dong", "netease 沒有派對」。", "成团初期玩的是 Two Door Cinema Club 式电子摇滚，停团一年后才转成油渍摇滚。", "《醜奴兒》首批 2000 张手工 CD 只在 11 家咖啡馆和独立唱片行卖，三天就没了。", "2021 小巨蛋 11,000 张票不到一分钟卖光，黄牛价炒到 34,500 元，乐迷戏称「草东没有门票」。", "专辑名借辛弃疾词牌《丑奴儿》，自嘲「为赋新词强说愁」。"]}, {"date": "2026-10-24", "name": "Stevie Wonder", "name_native": "Stevie Wonder", "name_zh": "史蒂维·旺德", "name_en": "Stevie Wonder", "badge": "跨时代经典", "kind": "classic", "region": "欧美", "meta": "美国 · 唱作人 / 多乐器手 / 制作人 · 1950 年生于密歇根州萨吉诺 · 11 岁签约 Motown", "why": "你刚听完山下達郎，又收藏了杏里和 Ginger Root——这几位往后追，都会追到 1970 年代那个几乎一个人重写了 R&B 的盲人天才。城市流行骨子里的放克与和声，很多都从他这儿长出来。", "photo": "daily_artist/20261024_steviewonder_apple.jpg", "photo_credit": "照片：Apple Music", "stats": [["25 座", "格莱美奖，男独唱歌手最多"], ["1 亿+", "全球唱片销量"], ["3 连", "连续三张专辑拿下年度专辑奖（无人并列）"]], "in_library": [], "story": {"paragraphs": ["1950 年他生在密歇根州萨吉诺，早产六周，暖箱里过高的氧气让视网膜病变，出生后不久就失明。四岁随母亲搬到底特律，八岁就在教堂唱诗班做独唱；九岁钢琴、口琴、鼓都已经上手。1961 年，The Miracles 的 Ronnie White 听他在朋友面前唱歌，把他带到 Motown 试音——老板 Berry Gordy 当场签约，制作人给他起了艺名 **Little Stevie Wonder**。", "13 岁那年，现场专辑里的《Fingertips》登顶 Billboard Hot 100，他成了史上最年轻的个人榜首歌手。二十岁出头他故意让旧合约到期，用已经录好的合成器小样当筹码，跟 Motown 谈下一份在当时极罕见的自由合同：更高版税、自己当制作人。接下来就是后来被叫做「经典时期」的五年——《Music of My Mind》《Talking Book》《Innervisions》《Fulfillingness' First Finale》《Songs in the Key of Life》。他几乎一个人包办人声、键盘、鼓和编曲，还把 TONTO 模块合成器请进流行乐。", "《Innervisions》发行三天后，巡回途中车祸让他昏迷四天，嗅觉部分丧失。出院后他没有停：连续三张专辑拿下格莱美「年度专辑」，至今仍是唯一连续三张都获奖的艺人。1976 年的双碟《Songs in the Key of Life》一发行就空降 Billboard 专辑榜第一，并在榜首待了十四周；《Rolling Stone》后来把它排进「史上最伟大专辑」前五。", "八零年代他走向更大的公共舞台：和 Paul McCartney 合唱《Ebony and Ivory》，为马丁·路德·金诞辰立法奔走并写下《Happy Birthday》，凭《I Just Called to Say I Love You》拿下奥斯卡最佳原创歌曲——领奖时他提到纳尔逊·曼德拉，南非当局随即禁播他的歌。2009 年他成为联合国和平使者，2014 年获总统自由勋章。2024 年他的 74 岁生日那天，加纳总统授予他加纳公民身份。"], "sources": [["Wikipedia: Stevie Wonder", "https://en.wikipedia.org/wiki/Stevie_Wonder"], ["Wikipedia: Talking Book", "https://en.wikipedia.org/wiki/Talking_Book"], ["Wikipedia: Innervisions", "https://en.wikipedia.org/wiki/Innervisions"], ["Wikipedia: Songs in the Key of Life", "https://en.wikipedia.org/wiki/Songs_in_the_Key_of_Life"], ["Wikipedia: Superstition (song)", "https://en.wikipedia.org/wiki/Superstition_(song)"], ["Grammy Artist Profile: Stevie Wonder", "https://www.grammy.com/artists/stevie-wonder/7894"]]}, "songs": [{"title": "Superstition", "album": "Talking Book", "year": 1972, "netease_id": 21612882, "cover": "daily_artist/ne_1991047.jpg", "starter": true, "why": "《Talking Book》里那把 Clavinet riff，几乎成了放克的同义词。本来想给 Jeff Beck 当 demo，结果太好只好自己留着；后来成了他时隔十年再登 Billboard 榜首的单曲。", "artist": "Stevie Wonder", "netease": "https://music.163.com/song?id=21612882", "file_flac": "/115/音乐库/每日歌手/20261024_Stevie Wonder/Stevie Wonder - Superstition.flac", "file_mp3": "", "dest": "/115/音乐库/每日歌手/20261024_Stevie Wonder/", "youtube": "https://www.youtube.com/watch?v=97hwNY3ni10"}, {"title": "Sir Duke", "album": "Songs In The Key Of Life", "year": 1976, "netease_id": 21612831, "cover": "daily_artist/ne_1991043.jpg", "starter": true, "why": "写给爵士英雄们的一首欢呼歌：Duke Ellington、Count Basie、Louis Armstrong、Glenn Miller。铜管一进来，整个人会被抬起来。", "artist": "Stevie Wonder", "netease": "https://music.163.com/song?id=21612831", "file_flac": "/115/音乐库/每日歌手/20261024_Stevie Wonder/Stevie Wonder - Sir Duke.flac", "file_mp3": "", "dest": "/115/音乐库/每日歌手/20261024_Stevie Wonder/", "youtube": "https://www.youtube.com/watch?v=ArgHvssVfF8"}, {"title": "Isn't She Lovely", "album": "Songs In The Key Of Life", "year": 1976, "netease_id": 21612837, "cover": "daily_artist/ne_1991043.jpg", "starter": true, "why": "写给刚出生的女儿 Aisha。他拒绝把六分半剪短出单曲，美国电台照样播；口琴那段，Bob Dylan 都夸「真的不可思议」。", "artist": "Stevie Wonder", "netease": "https://music.163.com/song?id=21612837", "file_flac": "/115/音乐库/每日歌手/20261024_Stevie Wonder/Stevie Wonder - Isn't She Lovely.flac", "file_mp3": "", "dest": "/115/音乐库/每日歌手/20261024_Stevie Wonder/", "youtube": "https://www.youtube.com/watch?v=RfHQOlHJczU"}, {"title": "Higher Ground", "album": "Innervisions", "year": 1973, "netease_id": 21612863, "cover": "daily_artist/ne_1991045.jpg", "starter": false, "why": "据说三小时写完录完。专辑发行三天后他出了严重车祸昏迷四天；醒来后这首关于轮回与站上更高处的歌，多了一层别人读不出来的意思。", "artist": "Stevie Wonder", "netease": "https://music.163.com/song?id=21612863", "file_flac": "/115/音乐库/每日歌手/20261024_Stevie Wonder/Stevie Wonder - Higher Ground.flac", "file_mp3": "", "dest": "/115/音乐库/每日歌手/20261024_Stevie Wonder/", "youtube": "https://www.youtube.com/watch?v=I1_uU9eIZRo"}, {"title": "I Wish", "album": "Songs In The Key Of Life", "year": 1976, "netease_id": 21612832, "cover": "daily_artist/ne_1991043.jpg", "starter": false, "why": "《Songs in the Key of Life》另一支榜首单曲。贝斯线一出来就知道是他：童年、街头、想再当一次小孩的那种跳。", "artist": "Stevie Wonder", "netease": "https://music.163.com/song?id=21612832", "file_flac": "/115/音乐库/每日歌手/20261024_Stevie Wonder/Stevie Wonder - I Wish.flac", "file_mp3": "", "dest": "/115/音乐库/每日歌手/20261024_Stevie Wonder/"}], "songs_note": "5 首都已下到你的网盘（FLAC 优先），点金色按钮就能直接放。", "albums": [{"title": "Talking Book", "year": 1972, "cover": "daily_artist/ne_1991047.jpg", "desc": "《Superstition》《You Are the Sunshine of My Life》都在这张；经典时期真正「踩稳」的一张。"}, {"title": "Innervisions", "year": 1973, "cover": "daily_artist/ne_1991045.jpg", "desc": "《Higher Ground》《Living for the City》；他第一座格莱美年度专辑。"}, {"title": "Songs In The Key Of Life", "year": 1976, "cover": "daily_artist/ne_1991043.jpg", "desc": "双碟加附赠 EP；《Sir Duke》《Isn't She Lovely》《I Wish》都在这里，常被称作他的巅峰。"}], "awards": [["1963", "《Fingertips》登顶 Billboard，史上最年轻个人榜首"], ["1974", "《Innervisions》获格莱美年度专辑"], ["1975", "《Fulfillingness' First Finale》再获年度专辑"], ["1977", "《Songs in the Key of Life》第三座年度专辑；制作人奖"], ["1985", "《I Just Called to Say I Love You》获奥斯卡最佳原创歌曲"], ["1989", "入选摇滚名人堂"], ["2009", "联合国和平使者；奥巴马在白宫为他颁 Gershwin Prize"], ["2014", "获美国总统自由勋章"], ["2024", "加纳授予公民身份"]], "influences": {"from": [{"name": "Ray Charles", "desc": "童年偶像；出道早期专辑就有向他致敬的翻唱"}, {"name": "Duke Ellington", "desc": "《Sir Duke》里「the king of all」指的就是他"}, {"name": "Motown / Berry Gordy", "desc": "11 岁把他签进 Tamla，给了舞台也给了后来要打破的框"}], "to": [{"name": "山下達郎 Tatsuro Yamashita", "desc": "日本城市流行的和声与节奏里，常常听得到 Wonder 那一路放克", "tag": "已介绍过"}, {"name": "杏里 / Anri", "desc": "你收藏的《Remember Summer Days》那种明亮节奏，血脉里有 Motown / Wonder", "tag": "你收藏过她的歌"}, {"name": "Ginger Root", "desc": "公开说灵感来自昭和城市流行；再往上溯就是 Wonder 重写过的 R&B", "tag": "你刚收藏"}, {"name": "Kanye West", "desc": "说过自己要以《Innervisions》和《Songs in the Key of Life》当标杆"}]}, "live": [{"title": "Superstition（Live 8，2005）", "yt": "lwvlBZE2wt8", "url": "https://www.youtube.com/watch?v=lwvlBZE2wt8", "thumb": "daily_artist/yt_lwvlBZE2wt8.jpg", "src": "Live 8 官方频道", "desc": "2005 年 Live 8 慈善演唱会官方影像：全球直播的舞台上把这首放克经典再唱一遍。"}, {"title": "Higher Ground（Musikladen，1974）", "yt": "I1_uU9eIZRo", "url": "https://www.youtube.com/watch?v=I1_uU9eIZRo", "thumb": "daily_artist/yt_I1_uU9eIZRo.jpg", "src": "Musikladen", "desc": "德国电视节目 Musikladen 1974 年现场——车祸之后不久，状态却锋利得吓人。"}, {"title": "Isn't She Lovely（Hyde Park，2016）", "yt": "RfHQOlHJczU", "url": "https://www.youtube.com/watch?v=RfHQOlHJczU", "thumb": "daily_artist/yt_RfHQOlHJczU.jpg", "src": "现场观众拍摄", "desc": "2016 年伦敦海德公园：口琴、阳光、把写给女儿的歌唱给几万人听。"}], "live_note": {"text": "更多演出与官方影像可搜他的名字；Live At Last（O2 Arena）是较完整的一版音乐会DVD", "link": ["Stevie Wonder", "https://en.wikipedia.org/wiki/Stevie_Wonder"]}, "trivia": ["早产儿暖箱里过高的氧气，加重了视网膜病变，导致他失明。", "13 岁靠《Fingertips》成为 Billboard Hot 100 史上最年轻的个人榜首歌手。", "《Superstition》最初是给 Jeff Beck 的 demo，录完发现太好，只好自己留下。", "《Isn't She Lovely》写给女儿 Aisha；他拒绝删短出单曲，美国仍靠电台打响。", "他是唯一一位用连续三张专辑都拿下格莱美「年度专辑」的艺人。", "2024 年 74 岁生日当天，在加纳首都阿克拉宣誓成为加纳公民。"]}, {"date": "2026-10-23", "name": "米津玄師 Kenshi Yonezu", "name_native": "米津玄師", "name_zh": "米津玄师", "name_en": "Kenshi Yonezu", "badge": "现象级", "kind": "hot", "region": "日本", "meta": "日本 · 唱作人 / 制作人 / 插画家 · 1991 年生于德岛 · 2009 年起以「ハチ」之名做 VOCALOID", "why": "你关注的宇多田ヒカル和他第一次合作，就是你曲库里那首《JANE DOE》——这也是他第一次在单曲里请别的歌手来唱。他的《KICK BACK》又是和你同步过的 King Gnu 主脑常田大希一起编的。今天日推坐时光机，他是正在发生的那一页：《IRIS OUT》从去年秋天到今年春天连续 24 周霸占 Oricon 流媒体周榜第一。", "photo": "daily_artist/20261023_yonezu_apple.jpg", "photo_credit": "照片：Apple Music", "stats": [["9 亿+", "《Lemon》MV 播放，日本歌最多"], ["第 5 名", "《IRIS OUT》Billboard 全球榜，日语歌最高"], ["55 亿+", "网易云播放，日本歌手第一（2025）"]], "in_library": ["JANE DOE · 米津玄師 & 宇多田ヒカル"], "story": {"paragraphs": ["1991 年他生在德岛，从小不太会跟人打交道，最想当的是漫画家。小学五年级在网上看 Flash 动画，被里面用的 BUMP OF CHICKEN 击中；初二和同学组了乐队，往 niconico 上传了 24 首歌，最多的一首也只有两万多播放。高中毕业去大阪读美术学校，他换了台电脑、开始用初音未来写歌，起了个名字叫**「ハチ」**（八）。《マトリョシカ》《パンダヒーロー》一首接一首破百万，他成了最红的 VOCALOID 作者之一。", "可他觉得自己跟人合作不来，干脆一个人干：2012 年用真名、用自己的声音出了第一张专辑《diorama》，作词作曲编曲、所有乐器和混音都是他一个人，MV 和封面也是自己画（有创作小组的朋友帮忙）。出道后整整两年没开过一场演唱会，第一次上电视直播唱歌，已经是 2018 年的红白——他没去 NHK 会场，而是回老家德岛的大塚国际美术馆，在一片烛光里唱完整首《Lemon》。他说答应出演，是因为想在祖父生活过的地方唱这首歌。", "《Lemon》之后他什么都碰：给小学生组合 Foorin 写的《パプリカ》拿了日本唱片大赏；2020 年专辑《STRAY SHEEP》成了日本独唱歌手第一张双百万专辑；宫崎骏在吉卜力的托儿所听孩子们唱《パプリカ》，于是请他写《你想活出怎样的人生》的主题曲《地球儀》，听歌时落了泪。他说那是他这辈子最大的荣耀。", "最近几年是**电锯人**的几年：2022 年《KICK BACK》和常田大希一起编曲，成为第一首拿到美国 RIAA 白金认证的日语歌；2025 年给电影版写的《IRIS OUT》四周破 1 亿播放、冲到 Billboard 全球榜第 5，片尾曲《JANE DOE》请来宇多田ヒカル合唱。2025 年他第一次开世界巡演，去了上海、台北、首尔、巴黎、伦敦、洛杉矶和纽约；网易云说他是平台 12 年来播放最多的日本歌手。"], "sources": [["Wikipedia: Kenshi Yonezu", "https://en.wikipedia.org/wiki/Kenshi_Yonezu"], ["维基百科（日）米津玄師", "https://ja.wikipedia.org/wiki/%E7%B1%B3%E6%B4%A5%E7%8E%84%E5%B8%AB"], ["维基百科（日）Lemon (米津玄師の曲)", "https://ja.wikipedia.org/wiki/Lemon_(%E7%B1%B3%E6%B4%A5%E7%8E%84%E5%B8%AB%E3%81%AE%E6%9B%B2)"], ["Wikipedia: Kick Back (song)", "https://en.wikipedia.org/wiki/Kick_Back_(song)"], ["维基百科（日）IRIS OUT/JANE DOE", "https://ja.wikipedia.org/wiki/IRIS_OUT/JANE_DOE"], ["维基百科（日）感電 (米津玄師の曲)", "https://ja.wikipedia.org/wiki/%E6%84%9F%E9%9B%BB_(%E7%B1%B3%E6%B4%A5%E7%8E%84%E5%B8%AB%E3%81%AE%E6%9B%B2)"], ["维基百科（日）アイネクライネ (米津玄師の曲)", "https://ja.wikipedia.org/wiki/%E3%82%A2%E3%82%A4%E3%83%8D%E3%82%AF%E3%83%A9%E3%82%A4%E3%83%8D_(%E7%B1%B3%E6%B4%A5%E7%8E%84%E5%B8%AB%E3%81%AE%E6%9B%B2)"]]}, "songs": [{"title": "Lemon", "album": "Lemon", "year": 2018, "netease_id": 536622304, "cover": "daily_artist/ne_37575103.jpg", "starter": true, "why": "日剧《非自然死亡》（アンナチュラル）主题曲。写到一半他的祖父去世，他说这首歌最后好像只说了一句「你走了，我很难过」。日本史上第一首下载破 300 万的歌，连续两年拿下 Billboard JAPAN 年榜第一。", "artist": "米津玄師 Kenshi Yonezu", "netease": "https://music.163.com/song?id=536622304", "file_flac": "/115/音乐库/每日歌手/20261023_米津玄師/米津玄師 - Lemon.flac", "file_mp3": "", "dest": "/115/音乐库/每日歌手/20261023_米津玄師/", "youtube": "https://www.youtube.com/watch?v=SX_ViT4Ra7k"}, {"title": "KICK BACK", "album": "KICK BACK", "year": 2022, "netease_id": 1986803568, "cover": "daily_artist/ne_152687983.jpg", "starter": true, "why": "动画《电锯人》片头曲，和你同步过的 King Gnu 主脑常田大希一起编曲，还采样了早安少女组的老歌。第一首拿到美国 RIAA 白金认证的日语歌。", "artist": "米津玄師 Kenshi Yonezu", "netease": "https://music.163.com/song?id=1986803568", "file_flac": "/115/音乐库/每日歌手/20261023_米津玄師/米津玄師 - KICK BACK.flac", "file_mp3": "", "dest": "/115/音乐库/每日歌手/20261023_米津玄師/", "youtube": "https://www.youtube.com/watch?v=M2cckDmNLMI"}, {"title": "IRIS OUT", "album": "IRIS OUT", "year": 2025, "netease_id": 2745026895, "cover": "daily_artist/ne_284617635.jpg", "starter": true, "why": "电影《电锯人 蕾塞篇》主题曲。他说不想写成《KICK BACK 2》，要像跳楼机一样「咚地开始、一路冲到底、啪地结束」，全曲只有两分半。日本史上最快破 1 亿播放的歌，Billboard 全球榜第 5，日语歌最高。", "artist": "米津玄師 Kenshi Yonezu", "netease": "https://music.163.com/song?id=2745026895", "file_flac": "/115/音乐库/每日歌手/20261023_米津玄師/米津玄師 - IRIS OUT.flac", "file_mp3": "", "dest": "/115/音乐库/每日歌手/20261023_米津玄師/", "youtube": "https://www.youtube.com/watch?v=LmZD-TU96q4"}, {"title": "感電", "album": "STRAY SHEEP", "year": 2020, "netease_id": 1466597802, "cover": "daily_artist/ne_93162249.jpg", "starter": false, "why": "日剧《MIU404》主题曲。剧是警察故事，他就想做成昭和刑事剧那样铜管在前面冲的曲子；暂定名本来叫《小狗警察》，因为撞了童谣名才改。", "artist": "米津玄師 Kenshi Yonezu", "netease": "https://music.163.com/song?id=1466597802", "file_flac": "/115/音乐库/每日歌手/20261023_米津玄師/米津玄師 - 感電.flac", "file_mp3": "", "dest": "/115/音乐库/每日歌手/20261023_米津玄師/", "youtube": "https://www.youtube.com/watch?v=UFQEttrn6CQ"}, {"title": "アイネクライネ", "album": "YANKEE", "year": 2014, "netease_id": 28445990, "cover": "daily_artist/ne_2794236.jpg", "starter": false, "why": "2014 年给东京地铁广告写的，是他第一首商业合作，也是他第一次请外部制作人（蔦谷好位置）。从没出过单曲，十年后还常年挂在日本榜单上。", "artist": "米津玄師 Kenshi Yonezu", "netease": "https://music.163.com/song?id=28445990", "file_flac": "/115/音乐库/每日歌手/20261023_米津玄師/米津玄師 - アイネクライネ.flac", "file_mp3": "", "dest": "/115/音乐库/每日歌手/20261023_米津玄師/", "youtube": "https://www.youtube.com/watch?v=-EKxzId_Sj4"}], "songs_note": "5 首都已下到你的网盘（FLAC 优先），点金色按钮就能直接放。", "albums": [{"title": "YANKEE", "year": 2014, "cover": "daily_artist/ne_2794236.jpg", "desc": "大厂出道后的第一张专辑，《アイネクライネ》就在这里；发完这张他才开了生涯第一场演唱会。"}, {"title": "BOOTLEG", "year": 2017, "cover": "daily_artist/ne_36529043.jpg", "desc": "收了《打上花火》《LOSER》《ピースサイン》等热门单曲，拿下 CD Shop 大赏和日本唱片大赏最优秀专辑。"}, {"title": "STRAY SHEEP", "year": 2020, "cover": "daily_artist/ne_93162249.jpg", "desc": "收了《Lemon》《感電》《パプリカ》，日本年度专辑榜几乎全拿第一，是日本独唱歌手第一张双百万专辑。"}], "awards": [["2009", "以「ハチ」之名发表 VOCALOID 歌曲，《結ンデ開イテ羅刹ト骸》首次破百万播放"], ["2012", "真名出道专辑《diorama》，获第 5 回 CD Shop 大赏"], ["2018", "《BOOTLEG》获第 60 回日本唱片大赏最优秀专辑；首次登上 NHK 红白（从德岛直播《Lemon》）"], ["2019", "《パプリカ》（Foorin）获日本唱片大赏大奖；《Lemon》连续两年 Billboard JAPAN 年榜第一"], ["2020", "《STRAY SHEEP》成为日本独唱歌手首张双百万专辑"], ["2021", "获第 71 回艺术选奖新人赏（大众艺能部门）"], ["2023", "为宫崎骏《你想活出怎样的人生》写主题曲《地球儀》"], ["2025", "《KICK BACK》获美国 RIAA 白金，日语歌第一首；《IRIS OUT》登 Billboard 全球榜第 5"]], "influences": {"from": [{"name": "BUMP OF CHICKEN", "desc": "小学在 Flash 动画里听到，他公开说是影响最大的乐队"}, {"name": "ASIAN KUNG-FU GENERATION", "desc": "同样是 Flash 动画年代的启蒙，最爱他们的《24時》"}, {"name": "RADWIMPS", "desc": "高中时开始听，他说像「伟大的父亲」"}, {"name": "平沢進", "desc": "18 岁在 niconico 上听到，说《MOTHER》改变了他的人生"}, {"name": "宫崎骏", "desc": "「影响大到不好意思」，后来真的给他写了主题曲"}], "to": [{"name": "宇多田ヒカル Hikaru Utada", "desc": "2025 年《JANE DOE》合唱，是宇多田第一次和他合作", "tag": "你关注的"}, {"name": "King Gnu · 常田大希", "desc": "和他一起编曲制作《KICK BACK》，还出现在 MV 里", "tag": "你的歌单里有"}, {"name": "Foorin", "desc": "他给这支小学生组合写了《パプリカ》，拿下日本唱片大赏"}, {"name": "菅田将暉", "desc": "他为菅田写了《まちがいさがし》的词，拿到 MTV VMAJ 最佳流行 MV"}]}, "live": [{"title": "KICK BACK（Live with 常田大希）", "yt": "HSNWJbkIsmo", "url": "https://www.youtube.com/watch?v=HSNWJbkIsmo", "thumb": "daily_artist/yt_HSNWJbkIsmo.jpg", "src": "米津玄師官方频道", "desc": "官方频道发布的同台版本：常田大希是这首歌的共同编曲，也和他一起出现在 MV 里。"}, {"title": "IRIS OUT（第 76 回 NHK 红白歌合战）", "yt": "MJ70B_cwnPk", "url": "https://www.youtube.com/watch?v=MJ70B_cwnPk", "thumb": "daily_artist/yt_MJ70B_cwnPk.jpg", "src": "米津玄師官方频道", "desc": "2025 年除夕，这首歌在红白上世界首演，女团 HANA 伴舞。他至今只在红白上做过三次电视演出。"}, {"title": "Live from 2019 Tour / 脊椎がオパールになる頃", "yt": "EnfuDqHZeaU", "url": "https://www.youtube.com/watch?v=EnfuDqHZeaU", "thumb": "daily_artist/yt_EnfuDqHZeaU.jpg", "src": "米津玄師官方频道", "desc": "2019 年第一次体育馆巡演的 33 分钟官方现场合集；这趟巡演也是他第一次去中国大陆和台湾演出。"}], "live_note": {"text": "更多官方 MV 和现场在他的 YouTube 频道", "link": ["@KenshiYonezu", "https://www.youtube.com/@KenshiYonezu"]}, "trivia": ["他身高 188 厘米。", "用「ハチ」写 VOCALOID 时，他根本不知道真鼓怎么打，写出来的鼓点有的用两只手根本敲不出来。", "出道前他先用自己的声音传了 30 来首歌，后来全删了，理由是「受别人影响太明显」。", "《Lemon》暂定名叫《Memento》（遗物、纪念），因为太直白才改掉。", "《感電》暂定名叫《犬のおまわりさん》（小狗警察），歌里的猫叫狗叫是最先写好的部分。", "给宫崎骏当面放《地球儀》demo 时他紧张得像「走上绞刑台」，看到宫崎骏落泪，他说「这个画面我会抱着过一辈子」。"]}, {"date": "2026-10-22", "name": "邓丽君 Teresa Teng", "name_native": "鄧麗君", "name_zh": "邓丽君", "name_en": "Teresa Teng", "badge": "跨时代经典", "kind": "classic", "region": "华语", "meta": "台湾 · 歌手 · 华语流行 / 日本歌谣曲 · 1953–1995 · 生于台湾云林", "why": "今天日推是「邻境曲风」，从你熟悉的日本味道往旁边挪一步，就挪到了她：最早把华语流行和日本歌谣曲接在一起的人，在日本连拿三年有线大赏。你同步过的桑田佳祐翻唱过她的《つぐない》，她也翻唱过桑田的《Merry X'mas in Summer》。", "photo": "daily_artist/20261022_tengteresa_apple.jpg", "photo_credit": "照片：Apple Music", "stats": [["4800 万+", "唱片销量（不含中国大陆，IFPI）"], ["1700+", "录过的歌"], ["3 连冠", "日本有线大赏 1984–86"]], "in_library": [], "story": {"paragraphs": ["1953 年她出生在台湾云林，本名**邓丽筠**——「筠」常被人念成 jūn，她干脆把艺名改成了丽君。爸爸是京剧迷，妈妈爱黄梅调，常带她去戏院；六岁开始学唱，1964 年唱黄梅调电影《梁山伯与祝英台》里的《访英台》拿了第一个大奖。十四岁她休学专职唱歌，在台北的夜总会连唱了 70 天，每天 90 分钟。", "1974 年她去日本。第一张走偶像路线的单曲只排到 Oricon 第 75 名，公司差点放弃；第二张改唱演歌味的《空港》，卖了 70 万张，拿下日本唱片大赏新人赏。1979 年她因为拿印尼护照入境被日本驱逐一年，索性去美国读书——《甜蜜蜜》《小城故事》就是那段时间录的。", "华语这边，1977 年那首《月亮代表我的心》差点不存在：作曲翁清溪嫌它不好，是词作者孙仪从废稿里捡回来的。她的版本传遍了华人世界，成了最早一批流进中国大陆的港台流行歌。1983 年她出了《**淡淡幽情**》，把唐诗宋词谱成新歌，卖出五百多万张，是她自己最受好评的一张。", "1984 年她重回日本，和作词荒木とよひさ、作曲三木たかし连出三首：《つぐない》《愛人》（有线点播榜连续 14 周第一）《時の流れに身をまかせ》，连续三年拿下日本有线大赏，外国歌手里只有她一个。1995 年 5 月她在泰国清迈度假时突然去世，年仅 42 岁。2007 年东京古贺政男音乐博物馆把她选进「大众音乐殿堂」，她是唯一的非日本人。"], "sources": [["Wikipedia: Teresa Teng", "https://en.wikipedia.org/wiki/Teresa_Teng"], ["维基百科（中）鄧麗君", "https://zh.wikipedia.org/wiki/%E9%84%A7%E9%BA%97%E5%90%9B"], ["维基百科（日）テレサ・テン", "https://ja.wikipedia.org/wiki/%E3%83%86%E3%83%AC%E3%82%B5%E3%83%BB%E3%83%86%E3%83%B3"], ["Wikipedia: The Moon Represents My Heart", "https://en.wikipedia.org/wiki/The_Moon_Represents_My_Heart"], ["维基百科（中）月亮代表我的心", "https://zh.wikipedia.org/wiki/%E6%9C%88%E4%BA%AE%E4%BB%A3%E8%A1%A8%E6%88%91%E7%9A%84%E5%BF%83"], ["维基百科（中）甜蜜蜜 (鄧麗君歌曲)", "https://zh.wikipedia.org/wiki/%E7%94%9C%E8%9C%9C%E8%9C%9C_(%E9%84%A7%E9%BA%97%E5%90%9B%E6%AD%8C%E6%9B%B2)"], ["维基百科（中）但願人長久 (鄧麗君歌曲)", "https://zh.wikipedia.org/wiki/%E4%BD%86%E9%A1%98%E4%BA%BA%E9%95%B7%E4%B9%85_(%E9%84%A7%E9%BA%97%E5%90%9B%E6%AD%8C%E6%9B%B2)"], ["维基百科（日）時の流れに身をまかせ", "https://ja.wikipedia.org/wiki/%E6%99%82%E3%81%AE%E6%B5%81%E3%82%8C%E3%81%AB%E8%BA%AB%E3%82%92%E3%81%BE%E3%81%8B%E3%81%9B"], ["维基百科（日）つぐない (テレサ・テンの曲)", "https://ja.wikipedia.org/wiki/%E3%81%A4%E3%81%90%E3%81%AA%E3%81%84_(%E3%83%86%E3%83%AC%E3%82%B5%E3%83%BB%E3%83%86%E3%83%B3%E3%81%AE%E6%9B%B2)"]]}, "songs": [{"title": "月亮代表我的心", "album": "岛国情歌第四集·香港之恋", "year": 1977, "netease_id": 4871918, "cover": "daily_artist/ne_489718.jpg", "starter": true, "why": "1977 年收进《岛国情歌第四集·香港之恋》。作曲翁清溪原本嫌它不好、准备扔掉，是词作者孙仪从废稿堆里捡回来填了词；2010 年华语金曲奖把它评为 30 年来华语经典第一。", "artist": "邓丽君 Teresa Teng", "netease": "https://music.163.com/song?id=4871918", "file_flac": "/115/音乐库/每日歌手/20261022_邓丽君/邓丽君 - 月亮代表我的心.flac", "file_mp3": "", "dest": "/115/音乐库/每日歌手/20261022_邓丽君/"}, {"title": "甜蜜蜜", "album": "甜蜜蜜", "year": 1979, "netease_id": 229744, "cover": "daily_artist/ne_23117.jpg", "starter": true, "why": "旋律取自印尼万丹的民谣《Dayung Sampan》（划舢舨）；词作者庄奴一听是写给邓丽君的，五分钟就把词填好了。1979 年她在美国读书那段时间录的。", "artist": "邓丽君 Teresa Teng", "netease": "https://music.163.com/song?id=229744", "file_flac": "/115/音乐库/每日歌手/20261022_邓丽君/邓丽君 - 甜蜜蜜
